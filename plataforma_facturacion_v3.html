<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de Solicitudes de Facturación</title>

<style>
:root{
  --ink:#13343B;--ink2:#0D2529;--paper:#EEF2F0;--paper2:#FFFFFF;
  --line:#CBD6D2;--amber:#D98E3F;--amber-d:#A6661F;
  --green:#3E7C5B;--green-bg:#E4F0E9;--red:#B3443A;--red-bg:#F8E7E4;
  --muted:#5C6E6B;--mono:'IBM Plex Mono','Courier New',monospace;
  --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--paper);color:var(--ink2);min-height:100vh;}
.app{max-width:980px;margin:0 auto;padding:28px 20px 60px;}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber-d);font-weight:600;}
.brand h1{font-size:22px;font-weight:700;color:var(--ink);}
.sp-badge{font-family:var(--mono);font-size:10.5px;padding:4px 10px;border-radius:3px;border:1px solid var(--ink);color:var(--ink);display:flex;align-items:center;gap:6px;}
.sp-badge.connected{border-color:var(--green);color:var(--green);background:var(--green-bg);}
.sp-badge.loading{border-color:var(--amber);color:var(--amber-d);background:#FFF8EE;}
.tabs{display:flex;gap:6px;}
.tab-btn{font-family:var(--mono);font-size:12.5px;padding:9px 16px;border:1px solid var(--ink);background:var(--paper2);color:var(--ink);cursor:pointer;border-radius:3px;transition:.15s;}
.tab-btn.active{background:var(--ink);color:#fff;}
.tab-btn:hover:not(.active){background:#dfe7e3;}
.stepper{display:flex;margin-bottom:26px;}
.snode{flex:1;position:relative;padding-top:10px;}
.snode .bar{height:4px;background:var(--line);border-radius:2px;}
.snode.done .bar,.snode.active .bar{background:var(--ink);}
.snode .lbl{font-family:var(--mono);font-size:11px;margin-top:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.snode.active .lbl{color:var(--ink);font-weight:700;}
.snode.done .lbl{color:var(--green);}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:24px;margin-bottom:18px;}
.card h2{font-size:17px;color:var(--ink);margin-bottom:4px;}
.hint{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
label.fl{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
select,input[type=text],input[type=password],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;font-family:var(--sans);font-size:14px;background:#fff;color:var(--ink2);}
select:focus,input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px;}
textarea{min-height:70px;resize:vertical;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}
.login-wrap{max-width:420px;margin:60px auto;}
.login-wrap .card{text-align:center;}
.login-wrap .card h2{font-size:20px;margin-bottom:8px;}
.login-avatar{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-family:var(--mono);font-weight:700;margin:0 auto 16px;}
.error-msg{color:var(--red);font-size:13px;margin-top:10px;padding:8px 12px;background:var(--red-bg);border-radius:4px;display:none;}
.error-msg.show{display:block;}
.manifest{border:1px dashed var(--ink);border-radius:4px;margin-top:8px;}
.manifest-head{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:9px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px 4px 0 0;}
.doc-row{display:flex;align-items:center;gap:14px;padding:14px;border-bottom:1px solid var(--line);}
.doc-row:last-child{border-bottom:none;}
.stamp{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:#fff;color:var(--muted);}
.doc-row.ok .stamp{border-color:var(--green);color:var(--green);background:var(--green-bg);}
.doc-row.err .stamp{border-color:var(--red);color:var(--red);background:var(--red-bg);}
.doc-info{flex:1;min-width:0;}
.doc-info .dname{font-weight:600;font-size:14px;}
.req-tag{font-family:var(--mono);font-size:10.5px;color:var(--amber-d);margin-left:8px;text-transform:uppercase;}
.status-msg{font-size:12.5px;margin-top:3px;color:var(--muted);}
.doc-row.ok .status-msg{color:var(--green);}
.doc-row.err .status-msg{color:var(--red);}
input[type=file]{display:none;}
.ubtn{font-family:var(--mono);font-size:12px;padding:8px 14px;border:1px solid var(--ink);background:#fff;border-radius:3px;cursor:pointer;white-space:nowrap;}
.ubtn:hover{background:var(--ink);color:#fff;}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;}
.btn{font-family:var(--mono);font-size:13px;padding:11px 22px;border-radius:4px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;}
.btn.primary{background:var(--ink);color:#fff;}
.btn.primary:disabled{background:#aab9b5;border-color:#aab9b5;cursor:not-allowed;}
.btn:hover:not(:disabled){opacity:.85;}
.btn.ghost{border-color:transparent;color:var(--muted);}
.blocker{background:var(--red-bg);border:1px solid var(--red);color:#7a2e26;border-radius:4px;padding:10px 14px;font-size:13px;margin-top:14px;display:none;}
.blocker.show{display:block;}
.ticket{border:2px solid var(--ink);border-radius:6px;padding:32px;background:#fff;text-align:center;}
.ticket .ok-icon{width:52px;height:52px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;}
.ticket .id-big{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.02em;margin:6px 0 14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--ink);}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:hover td{background:#f4f7f5;}
.pill{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:10px;text-transform:uppercase;}
.pill-pend{background:#FCEFD9;color:var(--amber-d);}
.pill-proc{background:#DCE6F5;color:#2A4D8F;}
.pill-fact{background:var(--green-bg);color:var(--green);}
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.filters select{width:auto;min-width:160px;}
.ss{font-family:var(--mono);font-size:11.5px;padding:4px 6px;width:auto;}
.client-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;background:var(--ink);color:#fff;padding:5px 10px;border-radius:3px;margin-top:10px;}
.client-tag .cid{color:#9FD8C0;}
.doc-pill{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:3px;margin:2px;background:var(--green-bg);color:var(--green);}
.sp-info{font-family:var(--mono);font-size:11px;color:var(--muted);padding:10px 14px;background:var(--paper);border-radius:4px;margin-top:8px;}
details summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink);margin-top:6px;}

.admin-tab{border-color:var(--amber)!important;color:var(--amber-d)!important;}
.admin-tab.active{background:var(--amber-d)!important;color:#fff!important;border-color:var(--amber-d)!important;}
</style>
</head>

async function spGet(url){
  const r = await fetch(url, {
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose'},
    credentials:'include'
  });
  if(!r.ok) throw new Error('SP ' + r.status);
  const j = await r.json();
  return j.d?.results ?? j.value ?? j;
}

async function spUpload(folderUrl, fileName, fileData){
  const r = await fetch(
    `${SP_SITE}/_api/web/getFolderByServerRelativePath(decodedurl='${encodeURIComponent(folderUrl)}')/files/add(url='${encodeURIComponent(fileName)}',overwrite=true)`,
    { method:'POST', headers:{'Accept':'application/json;odata=verbose','X-RequestDigest': await getDigest()}, body:fileData, credentials:'include' }
  );
  if(!r.ok) throw new Error('Upload ' + r.status);
  return r.json();
}

async function spAddItem(listName, data){
  const metaUrl = `${SP_SITE}/_api/web/lists/getbytitle('${listName}')`;
  const meta = await spGet(metaUrl + '?$select=ListItemEntityTypeFullName');
  const type = meta.d?.ListItemEntityTypeFullName ?? meta.ListItemEntityTypeFullName;
  const digest = await getDigest();
  const r = await fetch(`${SP_API}('${listName}')/items`, {
    method:'POST',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose','X-RequestDigest':digest},
    body: JSON.stringify({ __metadata:{type}, ...data }),
    credentials:'include'
  });
  if(!r.ok){ const t=await r.text(); throw new Error('AddItem '+r.status+' '+t.slice(0,200)); }
  return r.json();
}

async function getDigest(){
  const r = await fetch(`${SP_SITE}/_api/contextinfo`, {
    method:'POST', headers:{'Accept':'application/json;odata=verbose'}, credentials:'include'
  });
  const j = await r.json();
  return j.d?.GetContextWebInformation?.FormDigestValue ?? j.FormDigestValue;
}

      spGet(`${SP_API}('Solicitantes')/items?$select=Title,Activo,Correo&$top=200`),
      spGet(`${SP_API}('Empresas')/items?$select=Title,Activo&$top=50`),
      spGet(`${SP_API}('ClientesPorSolicitante')/items?$select=Title,NombreCliente,IDCliente,Empresa&$top=500`),
      spGet(`${SP_API}('ReglasDocumentos')/items?$select=IDCliente,NombreCliente,Plantilla,OC,HES,ActaConformidad,ExcelLiquidacion,AceptacionServicio,CDR,Adicionales,Notas&$top=500`),
    ]);
    spData = {
      solicitantes: solic.map(r=>[r.Title??r.NombreSolicitante, r.Activo?'Si':'No', r.Correo]),
      empresas: emp.map(r=>[r.Title, r.Activo?'Si':'No']),
      clientes: cli.map(r=>[r.Title??r.Solicitante, r.NombreCliente, r.IDCliente, r.Empresa]),
      reglas: reg.map(r=>[r.IDCliente,r.NombreCliente,r.Plantilla?'Si':'No',r.OC?'Si':'No',r.HES?'Si':'No',r.ActaConformidad?'Si':'No',r.ExcelLiquidacion?'Si':'No',r.AceptacionServicio?'Si':'No',r.CDR?'Si':'No',r.Adicionales?'Si':'No',r.Notas])
    };
    spStatus='ok';
  }catch(e){
    console.warn('SharePoint no accesible, usando datos locales:', e.message);
    spData = {
      solicitantes: SPDATA.solicitantes,
      empresas: SPDATA.empresas,
      clientes: SPDATA.clientes,
      reglas: SPDATA.reglas
    };
    spStatus='local';
  }
  renderSPBadge();
  if(user) renderNew();
}

function data(){ return spData || SPDATA; }

// ─── FILE HANDLING ────────────────────────────────────────────────────────────
function handleFile(key,file){
  if(!file) return;
  if(file.size>MAX_FILE){
    st.docs[key]={fileName:file.name,sizeKB:Math.round(file.size/1024),base64:null,validation:{ok:false,msg:'Archivo demasiado grande (máx. 1.8 MB).'}};
    renderNew(); return;
  }
  const reader=new FileReader();
  reader.onload=async function(e){
    const b64=e.target.result;
    const dt=DOC_TYPES.find(d=>d.key===key);
    const sKB=Math.round(file.size/1024);
    let v;
    if(dt.kind==='xlsx') v=await validateXlsx(b64,key);
    else if(dt.kind==='xlsx_gen') v=validateXlsxGeneric(file);
    else if(dt.kind==='pdf_kw') v=await validatePdfKw(file,b64,key);
    else v={ok:true,msg:'Archivo cargado'};
    st.docs[key]={fileName:file.name,sizeKB:sKB,base64:b64,validation:v};
    renderNew();
  };
  reader.readAsDataURL(file);
}

async function validateXlsx(b64,key){
  try{
    const wb=XLSX.read(b64.split(',')[1],{type:'base64'});
    if(!wb.SheetNames?.length) return {ok:false,msg:'Excel vacío o ilegible.'};
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).filter(r=>r.some(c=>String(c).trim()));
    if(rows.length<2) return {ok:false,msg:'El Excel no tiene datos debajo del encabezado.'};
    const header=rows[0].map(h=>String(h).trim()).filter(Boolean);
    if(header.length<2) return {ok:false,msg:'No se detectó un encabezado de columnas válido.'};
    // Cross-validate with Plantilla if not in skip list
    if(needsValidation() && st.idCliente){
      const cli=DATA_clienteRow();
      if(cli){
        const empresaInHeader=header.some(h=>h.toLowerCase().includes(cli[3].toLowerCase().replace('p. ','').replace('p.outsourcing','outsourcing')));
        const clienteInData=rows.flat().some(c=>String(c).toLowerCase().includes(cli[1].substring(0,6).toLowerCase()));
        if(!empresaInHeader && !clienteInData){
          return {ok:true,msg:`Excel válido — ${header.length} cols, ${rows.length-1} filas. (No se detectó referencia al cliente en el archivo, verifica que es el correcto.)`};
        }
      }
    }
    return {ok:true,msg:`Excel válido — ${header.length} columnas, ${rows.length-1} filas (hoja "${wb.SheetNames[0]}")`};
  }catch(e){ return {ok:false,msg:'No se pudo leer como Excel. Verifica que no esté dañado.'}; }
}

function validateXlsxGeneric(file){
  return /\.(xlsx|xls)$/i.test(file.name)?{ok:true,msg:'Excel cargado'}:{ok:false,msg:'Debe ser un archivo .xlsx o .xls'};
}

async function validatePdfKw(file,b64,key){
  const isPdf=/\.pdf$/i.test(file.name);
  const isExcel=/\.(xlsx|xls)$/i.test(file.name);
  if(!isPdf && !isExcel) return {ok:false,msg:`Formato no válido. Se esperaba PDF o Excel.`};
  // Basic structure check
  if(isPdf){
    try{
      const arr=Uint8Array.from(atob(b64.split(',')[1]),c=>c.charCodeAt(0));
      const txt=new TextDecoder('utf-8',{fatal:false}).decode(arr.slice(0,1024));
      if(!txt.startsWith('%PDF')) return {ok:false,msg:'El archivo no es un PDF válido (puede estar dañado o ser el formato incorrecto).'};
      // keyword search in full text
      const full=new TextDecoder('utf-8',{fatal:false}).decode(arr);
      const kws=KW_MAP[key]||[];
      const found=kws.find(k=>full.toLowerCase().includes(k.toLowerCase()));
      if(found) return {ok:true,msg:`PDF válido — se detectó referencia a "${found}".`};
      // if PDF is image-only (no text layer) we accept it
      const hasText=full.match(/\([\x20-\x7E]{4,}\)/g)?.length>5;
      if(!hasText) return {ok:true,msg:'PDF cargado (escaneado — no se pudo leer el texto; verifica visualmente que sea el documento correcto).'};
      return {ok:true,msg:'PDF cargado. No se detectaron palabras clave esperadas — verifica que sea el documento correcto.'};
    }catch(e){ return {ok:false,msg:'No se pudo leer el PDF.'}; }
  }
  return {ok:true,msg:'Archivo Excel cargado.'};
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
async function submitSolicitud(){
  const btn=document.getElementById('btnSend');
  btn.disabled=true; btn.textContent='Guardando…';
  const id='SOL-'+Date.now().toString(36).toUpperCase();
  const cr=DATA_clienteRow();
  const req=requiredDocs(st.idCliente);
  try{
    // 1. Save record to SP list (if SP ok) or local storage
    const record={
      id,fecha:new Date().toISOString(),
      solicitante:user.nombre,correo:user.correo,
      idCliente:st.idCliente,nombreCliente:cr?cr[1]:'',empresa:cr?cr[3]:'',
      notas:st.notas,estado:'Pendiente',documentos:req.map(d=>d.key)
    };
    if(spStatus==='ok'){
      await spAddItem('Solicitudes',{
        Title:id,
        Solicitante:user.nombre,
        IDCliente:st.idCliente,
        NombreCliente:cr?cr[1]:'',
        Empresa:cr?cr[3]:'',
        Estado:'Pendiente',
        Notas:st.notas,
        Documentos:req.map(d=>d.key).join(', '),
        FechaSolicitud:new Date().toISOString()
      });
      // 2. Upload docs to SP library
      const folder='/sites/Facturacin/'+LIB_DOC+'/'+id;
      await fetch(`${SP_SITE}/_api/web/folders`,{
        method:'POST',
        headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose','X-RequestDigest':await getDigest()},
        body:JSON.stringify({__metadata:{type:'SP.Folder'},ServerRelativeUrl:folder}),
        credentials:'include'
      });
      for(const dt of req){
        const d=st.docs[dt.key];
        if(d?.base64){
          const bin=atob(d.base64.split(',')[1]);
          const arr=new Uint8Array(bin.length);
          for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
          await spUpload(folder,d.fileName,arr.buffer);
        }
      }
    }
    // Always save locally too (as backup)
    await saveLocal(id,record);
    showTicket(id);
  }catch(err){
    console.error(err);
    // Fallback: save locally
    try{
      const record2={id,fecha:new Date().toISOString(),solicitante:user.nombre,correo:user.correo,idCliente:st.idCliente,nombreCliente:cr?cr[1]:'',empresa:cr?cr[3]:'',notas:st.notas,estado:'Pendiente',documentos:req.map(d=>d.key)};
      await saveLocal(id,record2);
      showTicket(id,'⚠ Guardado localmente (SharePoint no disponible en este momento). El administrador deberá sincronizar manualmente.');
    }catch(e2){
      alert('Error al guardar. Detalle: '+err.message);
      btn.disabled=false; btn.textContent='Enviar solicitud';
    }
  }
}

async function saveLocal(id,record){
  try{
    for(const dt of requiredDocs(st.idCliente)){
      const d=st.docs[dt.key];
      if(d?.base64) await window.storage.set(`doc:${id}:${dt.key}`,JSON.stringify({fileName:d.fileName,base64:d.base64}),true);
    }
    await window.storage.set(`sol:${id}`,JSON.stringify(record),true);
    let idx=[];
    try{ const r=await window.storage.get('sol:index',true); idx=r?JSON.parse(r.value):[]; }catch(e){idx=[];}
    idx.unshift(id);
    await window.storage.set('sol:index',JSON.stringify(idx),true);
  }catch(e){ console.warn('local storage failed',e); }
}

  document.getElementById('viewNew').innerHTML=`<div class="card ticket">

async function renderHist(){
  const el=document.getElementById('viewHist'); if(!el) return;
  el.innerHTML=`<div class="card"><p class="hint">Cargando…</p></div>`;
  let idx=[];
  try{ const r=await window.storage.get('sol:index',true); idx=r?JSON.parse(r.value):[]; }catch(e){idx=[];}
  const records=[];
  for(const id of idx){
    try{ const r=await window.storage.get(`sol:${id}`,true); if(r){ const rec=JSON.parse(r.value); if(rec.solicitante===user.nombre) records.push(rec); } }catch(e){}
  }
  if(!records.length){
    el.innerHTML=`<div class="card"><div style="text-align:center;padding:50px 20px;color:var(--muted);">No tienes solicitudes registradas aún.</div></div>`; return;
  }
  window.__histRecs=records;
  renderHistTable(records,'','');
}

      <td style="font-family:var(--mono);font-size:11.5px;">${esc(r.id)}</td>
      <td>${new Date(r.fecha).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'})}</td>
      <td>${esc(r.nombreCliente)}<br><span style="color:var(--muted);font-family:var(--mono);font-size:10.5px;">${esc(r.idCliente)}</span></td>
      <td>${esc(r.empresa)}</td>
      <td><details><summary>${(r.documentos||[]).length} docs</summary>${(r.documentos||[]).map(d=>`<div style="font-size:11.5px;margin-top:4px;cursor:pointer;text-decoration:underline;" onclick="dlDoc('${r.id}','${d}')">⬇ ${esc(d)}</div>`).join('')}</details></td>
      <td><span class="pill ${r.estado==='Pendiente'?'pill-pend':r.estado==='En proceso'?'pill-proc':'pill-fact'}">${esc(r.estado)}</span></td>
    </tr>`).join('')}
    </tbody></table>
  </div>`;
  document.getElementById('viewHist').innerHTML=html;
}

function applyHist(){
  const fEst=document.getElementById('fEst')?.value||'';
  renderHistTable(window.__histRecs||[],fEst);
}

async function dlDoc(id,key){
  try{
    const r=await window.storage.get(`doc:${id}:${key}`,true);
    if(!r){alert('Archivo no encontrado en almacenamiento local.');return;}
    const d=JSON.parse(r.value);
    const a=document.createElement('a'); a.href=d.base64; a.download=d.fileName;
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){alert('No se pudo descargar el archivo.');}
}

// ─── ADMIN PANEL ─────────────────────────────────────────────────────────────
async function renderAdmin(){
  const el=document.getElementById('viewAdmin'); if(!el) return;
  el.innerHTML=`<div class="card"><p class="hint">Cargando todas las solicitudes…</p></div>`;
  // Load from SP if available, else local
  let records=[];
  if(spStatus==='ok'){
    try{
      const items=await spGet(`${SP_API}('Solicitudes')/items?$select=Title,Solicitante,IDCliente,NombreCliente,Empresa,Estado,Notas,Documentos,FechaSolicitud&$orderby=FechaSolicitud desc&$top=500`);
      records=items.map(r=>({
        id:r.Title,fecha:r.FechaSolicitud,solicitante:r.Solicitante,
        idCliente:r.IDCliente,nombreCliente:r.NombreCliente,empresa:r.Empresa,
        estado:r.Estado||'Pendiente',notas:r.Notas,
        documentos:(r.Documentos||'').split(',').map(d=>d.trim()).filter(Boolean),
        spId:r.Id
      }));
    }catch(e){ console.warn('SP admin load failed',e); }
  }
  // merge local records not in SP
  let idx=[];
  try{ const r=await window.storage.get('sol:index',true); idx=r?JSON.parse(r.value):[]; }catch(e){}
  for(const id of idx){
    try{
      const r=await window.storage.get(`sol:${id}`,true);
      if(r){ const rec=JSON.parse(r.value); if(!records.find(x=>x.id===rec.id)) records.push(rec); }
    }catch(e){}
  }
  window.__adminRecs=records;
  renderAdminTable(records,'','','');
}

function renderAdminTable(recs,fSolic,fEst,fEmp){
  let f=recs;
  if(fSolic) f=f.filter(r=>r.solicitante===fSolic);
  if(fEst)   f=f.filter(r=>r.estado===fEst);
  if(fEmp)   f=f.filter(r=>r.empresa===fEmp);
  const solics=[...new Set(recs.map(r=>r.solicitante))].sort();
  const emps=[...new Set(recs.map(r=>r.empresa))].sort();
  const pend=recs.filter(r=>r.estado==='Pendiente').length;
  const proc=recs.filter(r=>r.estado==='En proceso').length;
  const fact=recs.filter(r=>r.estado==='Facturado').length;
  const html=`
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;">
    <div style="background:#FCEFD9;border-radius:6px;padding:16px;text-align:center;">
      <div style="font-family:var(--mono);font-size:11px;color:var(--amber-d);text-transform:uppercase;letter-spacing:.05em;">Pendientes</div>
      <div style="font-size:28px;font-weight:700;color:var(--amber-d);">${pend}</div>
    </div>
    <div style="background:#DCE6F5;border-radius:6px;padding:16px;text-align:center;">
      <div style="font-family:var(--mono);font-size:11px;color:#2A4D8F;text-transform:uppercase;letter-spacing:.05em;">En proceso</div>
      <div style="font-size:28px;font-weight:700;color:#2A4D8F;">${proc}</div>
    </div>
    <div style="background:var(--green-bg);border-radius:6px;padding:16px;text-align:center;">
      <div style="font-family:var(--mono);font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.05em;">Facturados</div>
      <div style="font-size:28px;font-weight:700;color:var(--green);">${fact}</div>
    </div>
  </div>
  <div class="card">
    <h2>Todas las solicitudes</h2>
    <p class="hint">${f.length} de ${recs.length} solicitudes en total</p>
    <div class="filters">
      <select id="aFSolic" onchange="applyAdmin()">
        <option value="">Todos los solicitantes</option>
        ${solics.map(s=>`<option value="${esc(s)}" ${s===fSolic?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <select id="aFEst" onchange="applyAdmin()">
        <option value="">Todos los estados</option>
        <option value="Pendiente" ${fEst==='Pendiente'?'selected':''}>Pendiente</option>
        <option value="En proceso" ${fEst==='En proceso'?'selected':''}>En proceso</option>
        <option value="Facturado" ${fEst==='Facturado'?'selected':''}>Facturado</option>
      </select>
      <select id="aFEmp" onchange="applyAdmin()">
        <option value="">Todas las empresas</option>
        ${emps.map(e=>`<option value="${esc(e)}" ${e===fEmp?'selected':''}>${esc(e)}</option>`).join('')}
      </select>
      <button class="btn" onclick="renderAdmin()" style="padding:8px 14px;font-size:12px;">↻ Actualizar</button>
    </div>
    <table>
      <thead><tr>
        <th>Código</th><th>Fecha</th><th>Solicitante</th><th>Cliente</th><th>Empresa</th><th>Documentos</th><th>Notas</th><th>Estado</th>
      </tr></thead>
      <tbody>
        ${f.length===0?`<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted);">No hay solicitudes con estos filtros.</td></tr>`:
        f.map(r=>`<tr>
          <td style="font-family:var(--mono);font-size:11px;">${esc(r.id)}</td>
          <td style="white-space:nowrap;">${r.fecha?new Date(r.fecha).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}):''}</td>
          <td>${esc(r.solicitante)}</td>
          <td>${esc(r.nombreCliente)}<br><span style="color:var(--muted);font-family:var(--mono);font-size:10px;">${esc(r.idCliente)}</span></td>
          <td>${esc(r.empresa)}</td>
          <td>
            <details><summary style="font-size:12px;cursor:pointer;">${(r.documentos||[]).length} docs</summary>
              ${(r.documentos||[]).map(d=>`<div style="font-size:11.5px;margin-top:3px;cursor:pointer;text-decoration:underline;" onclick="dlDoc('${r.id}','${d}')">⬇ ${esc(d)}</div>`).join('')}
            </details>
          </td>
          <td style="font-size:12px;color:var(--muted);max-width:140px;">${esc(r.notas||'—')}</td>
          <td>
            <select class="ss" onchange="adminUpdateEstado('${r.id}',this.value,${r.spId||'null'})">
              <option value="Pendiente" ${r.estado==='Pendiente'?'selected':''}>Pendiente</option>
              <option value="En proceso" ${r.estado==='En proceso'?'selected':''}>En proceso</option>
              <option value="Facturado" ${r.estado==='Facturado'?'selected':''}>Facturado</option>
            </select>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
  document.getElementById('viewAdmin').innerHTML=html;
}

function applyAdmin(){
  const s=document.getElementById('aFSolic')?.value||'';
  const e=document.getElementById('aFEst')?.value||'';
  const emp=document.getElementById('aFEmp')?.value||'';
  renderAdminTable(window.__adminRecs||[],s,e,emp);
}

async function adminUpdateEstado(id,nuevoEstado,spId){
  // Update in SP
  if(spStatus==='ok' && spId){
    try{
      const digest=await getDigest();
      await fetch(`${SP_API}('Solicitudes')/items(${spId})`,{
        method:'MERGE',
        headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose',
          'X-RequestDigest':digest,'IF-MATCH':'*','X-HTTP-Method':'MERGE'},
        body:JSON.stringify({__metadata:{type:'SP.Data.SolicitudesListItem'},Estado:nuevoEstado}),
        credentials:'include'
      });
    }catch(e){ console.warn('SP update failed',e); }
  }
  // Update local
  try{
    const r=await window.storage.get(`sol:${id}`,true);
    if(r){ const rec=JSON.parse(r.value); rec.estado=nuevoEstado; await window.storage.set(`sol:${id}`,JSON.stringify(rec),true); }
  }catch(e){}
  // Update in memory
  const rec=window.__adminRecs?.find(x=>x.id===id);
  if(rec) rec.estado=nuevoEstado;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderLogin();
loadSpData();
</script>
