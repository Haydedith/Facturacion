function computeLegStats(recs,dateField){
  const withResp=recs.filter(r=>r.fecha&&r[dateField]);
  const horasArr=withResp.map(r=>({r,h:horasEntre(r.fecha,r[dateField])})).filter(x=>x.h!==null&&x.h>=0);
  const respondidos=horasArr.length;
  const avgHoras=respondidos?horasArr.reduce((a,x)=>a+x.h,0)/respondidos:null;
  const dentroSLA=horasArr.filter(x=>x.h<=SLA_HORAS).length;
  const pctSLA=respondidos?Math.round(dentroSLA/respondidos*100):0;
  const bySol={};
  horasArr.forEach(x=>{(bySol[x.r.solicitante]=bySol[x.r.solicitante]||[]).push(x.h);});
  const ranking=Object.entries(bySol).map(([nombre,arr])=>({
    nombre,avgHoras:arr.reduce((a,b)=>a+b,0)/arr.length,count:arr.length
  })).sort((a,b)=>b.avgHoras-a.avgHoras);
  return {respondidos,avgHoras,pctSLA,dentroSLA,fueraSLA:respondidos-dentroSLA,ranking};
}

function computeMonitorStats(recs){
  const total=recs.length;
  const pendientes=recs.filter(r=>r.estado==='Pendiente').length;
  const facturados=recs.filter(r=>r.estado==='Facturado').length;
  const enviados=recs.filter(r=>r.estado==='Enviado').length;

  const legFacturado=computeLegStats(recs,'fechaFacturado');
  const legEnvio=computeLegStats(recs,'fechaEnvio');

  const bucketsRecep=[0,0,0,0],bucketsEnvio=[0,0,0,0];
  recs.forEach(r=>{if(r.fecha){const h=new Date(r.fecha).getHours();bucketsRecep[Math.min(3,Math.floor(h/6))]++;}});
  recs.filter(r=>r.fechaEnvio).forEach(r=>{const h=new Date(r.fechaEnvio).getHours();bucketsEnvio[Math.min(3,Math.floor(h/6))]++;});
  const totRecep=bucketsRecep.reduce((a,b)=>a+b,0)||1;
  const totEnvio=bucketsEnvio.reduce((a,b)=>a+b,0)||1;
  const pctRecep=bucketsRecep.map(v=>Math.round(v/totRecep*100));
  const pctEnvio=bucketsEnvio.map(v=>Math.round(v/totEnvio*100));

  const conFecha=recs.filter(r=>r.fecha);
  const conEnvio=recs.filter(r=>r.fechaEnvio);
  const avgHourRecep=conFecha.length?conFecha.reduce((a,r)=>a+new Date(r.fecha).getHours(),0)/conFecha.length:null;
  const avgHourEnvio=conEnvio.length?conEnvio.reduce((a,r)=>a+new Date(r.fechaEnvio).getHours(),0)/conEnvio.length:null;

  return {total,pendientes,facturados,enviados,legFacturado,legEnvio,pctRecep,pctEnvio,avgHourRecep,avgHourEnvio};
}

function fmtHora(h){
  if(h===null||h===undefined) return '—';
  const hh=Math.floor(h),mm=Math.round((h-hh)*60);
  return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

function gaugeSVG(pct){
  pct=Math.max(0,Math.min(100,Math.round(pct)));
  const cx=110,cy=112,r=88,sw=20;
  const toXY=(a)=>({x:cx-r*Math.cos(a*Math.PI/180),y:cy-r*Math.sin(a*Math.PI/180)});
  const zone=(a1,a2,color)=>{const p1=toXY(a1),p2=toXY(a2);
    return `<path d="M ${p1.x.toFixed(1)},${p1.y.toFixed(1)} A ${r},${r} 0 0,1 ${p2.x.toFixed(1)},${p2.y.toFixed(1)}" fill="none" stroke="${color}" stroke-width="${sw}"/>`;};
  const needleA=pct/100*180;
  const tip=toXY(needleA);
  const color=pct>=80?MON_COLORS.green:pct>=50?MON_COLORS.amber:MON_COLORS.red;
  return `<svg viewBox="0 0 220 130" style="width:100%;max-width:128px;">
    ${zone(0,90,MON_COLORS.red)}${zone(90,144,MON_COLORS.amber)}${zone(144,180,MON_COLORS.green)}
    <line x1="${cx}" y1="${cy}" x2="${tip.x.toFixed(1)}" y2="${tip.y.toFixed(1)}" stroke="${MON_COLORS.negro}" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="${MON_COLORS.negro}"/>
  </svg>
  <div style="text-align:center;margin-top:-6px;">
    <div style="font-size:19px;font-weight:700;color:${color};">${pct}%</div>
  </div>`;
}

function donutSVG(pct,color){
  pct=Math.max(0,Math.min(100,Math.round(pct)));
  const r=68,cx=90,cy=90,circ=2*Math.PI*r;
  const dash=circ*pct/100;
  return `<svg viewBox="0 0 180 180" style="width:100%;max-width:110px;">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${MON_COLORS.gris}" stroke-width="20"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="20"
      stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="30" font-weight="700" fill="${MON_COLORS.negro}">${pct}%</text>
  </svg>`;
}

function hourBarsHtml(pctRecep,pctFact){
  const labels=['00–06h','06–12h','12–18h','18–24h'];
  const cols=labels.map((lbl,i)=>{
    const hRecep=Math.max(3,pctRecep[i]*1.15),hFact=Math.max(3,pctFact[i]*1.15);
    return `<div class="hb-group">
      <div class="hb-cols">
        <div class="hb-col" style="height:${hRecep}px;background:${MON_COLORS.verdeDk};">${pctRecep[i]>0?`<span class="hb-val" style="color:${MON_COLORS.verdeDk};">${pctRecep[i]}%</span>`:''}</div>
        <div class="hb-col" style="height:${hFact}px;background:${MON_COLORS.negro};">${pctFact[i]>0?`<span class="hb-val" style="color:${MON_COLORS.negro};">${pctFact[i]}%</span>`:''}</div>
      </div>
      <div class="hb-lbl">${lbl}</div>
    </div>`;
  }).join('');
  return `<div class="hourbars">${cols}</div>`;
}

function gaugeCardHtml(title,sub,leg){
  return `<div class="card mon-card mon-gaugecard">
    <div class="mon-gauge-title">${title}</div>
    <div class="mon-gauge-sub">${sub}</div>
    ${gaugeSVG(leg.pctSLA)}
  </div>`;
}
function donutCardHtml(title,sub,leg){
  const donutColor=leg.avgHoras===null?MON_COLORS.muted:(leg.avgHoras<=SLA_HORAS?MON_COLORS.green:MON_COLORS.red);
  const donutPct=leg.avgHoras===null?0:Math.min(100,Math.round(leg.avgHoras/SLA_HORAS*100));
  return `<div class="card mon-card mon-gaugecard">
    <div class="mon-gauge-title">${title}</div>
    <div class="mon-gauge-sub">${sub}</div>
    ${donutSVG(donutPct,donutColor)}
    <div class="mon-gauge-avg">Prom: <b style="color:${donutColor};">${leg.avgHoras!==null?leg.avgHoras.toFixed(1)+'h':'—'}</b> · ${leg.respondidos} sol.</div>
  </div>`;
}

function renderMonitorDashboard(recs){
  let f=recs;
  if(mFEmp) f=f.filter(r=>r.empresa===mFEmp);
  if(mFSol) f=f.filter(r=>r.solicitante===mFSol);
  if(mFMes) f=f.filter(r=>r.fecha&&monthKey(r.fecha)===mFMes);

  const s=computeMonitorStats(f);
  const emps=[...new Set(recs.map(r=>r.empresa).filter(Boolean))].sort();
  const sols=[...new Set(recs.map(r=>r.solicitante).filter(Boolean))].sort();
  const meses=[...new Set(recs.filter(r=>r.fecha).map(r=>monthKey(r.fecha)))].sort();

  const maxRankHoras=Math.max(SLA_HORAS,...s.legEnvio.ranking.map(r=>r.avgHoras),1);
  const rankingHtml=s.legEnvio.ranking.length?s.legEnvio.ranking.map(r=>{
    const w=Math.min(100,r.avgHoras/maxRankHoras*100);
    const color=r.avgHoras<=SLA_HORAS?MON_COLORS.green:(r.avgHoras<=SLA_HORAS*1.5?MON_COLORS.amber:MON_COLORS.red);
    return `<div class="rank-row">
      <div class="rank-name" title="${esc(r.nombre)}">${esc(r.nombre)}</div>
      <div class="rank-track"><div class="rank-fill" style="width:${w}%;background:${color};"></div></div>
      <div class="rank-val" style="color:${color};">${r.avgHoras.toFixed(1)} h</div>
    </div>`;
  }).join(''):`<p style="color:var(--muted);font-size:12.5px;padding:10px 0;">Sin solicitudes enviadas en este filtro.</p>`;

  document.getElementById('viewMonitor').innerHTML=`
  <div class="card mon-card">
    <div class="mon-head-row">
      <div class="card-head"><h2>Panel de Monitoreo</h2><div class="sub">Tiempos de respuesta de facturación — ${f.length} de ${recs.length} solicitudes</div></div>
      <div class="filters">
        <select id="mFEmp" onchange="applyMonitor()">
          <option value="">Todas las empresas</option>
          ${emps.map(e=>`<option value="${esc(e)}" ${e===mFEmp?'selected':''}>${esc(e)}</option>`).join('')}
        </select>
        <select id="mFSol" onchange="applyMonitor()">
          <option value="">Todos los solicitantes</option>
          ${sols.map(sn=>`<option value="${esc(sn)}" ${sn===mFSol?'selected':''}>${esc(sn)}</option>`).join('')}
        </select>
        <select id="mFMes" onchange="applyMonitor()">
          <option value="">Todos los meses</option>
          ${meses.map(m=>`<option value="${esc(m)}" ${m===mFMes?'selected':''}>${esc(monthLabel(m))}</option>`).join('')}
        </select>
        <button class="btn sm" onclick="renderMonitor()">↻</button>
      </div>
    </div>
  </div>

  <div class="mon-topgrid">
    <div class="mon-kpi"><div class="val">${f.length}</div><div class="lbl">Solicitudes</div></div>
    <div class="mon-kpi"><div class="val" style="color:var(--amber);">${s.pendientes}</div><div class="lbl">Pendientes</div></div>
    <div class="mon-kpi"><div class="val" style="color:#2A4D8F;">${s.facturados}</div><div class="lbl">Facturados</div></div>
    <div class="mon-kpi"><div class="val" style="color:var(--green-ok);">${s.enviados}</div><div class="lbl">Enviados</div></div>
  </div>

  <div class="mon-grid4">
    ${gaugeCardHtml('Recep. → Facturado', `% dentro de ${SLA_HORAS}h`, s.legFacturado)}
    ${donutCardHtml('Prom. Facturado', `vs. meta ${SLA_HORAS}h`, s.legFacturado)}
    ${gaugeCardHtml('Recep. → Enviado', `% dentro de ${SLA_HORAS}h`, s.legEnvio)}
    ${donutCardHtml('Prom. Enviado', `vs. meta ${SLA_HORAS}h`, s.legEnvio)}
  </div>
  <div class="mon-legend" style="margin-bottom:10px;">
    <span><span class="dot" style="background:${MON_COLORS.red};"></span>&lt;50%</span>
    <span><span class="dot" style="background:${MON_COLORS.amber};"></span>50–80%</span>
    <span><span class="dot" style="background:${MON_COLORS.green};"></span>&gt;80%</span>
  </div>

  <div class="mon-bottom-row">
    <div class="card mon-card">
      <div class="card-head" style="margin-bottom:8px;"><h2 style="font-size:14px;">Hora de recepción vs. envío</h2><div class="sub" style="font-size:11px;">Distribución (%) por franja horaria</div></div>
      ${hourBarsHtml(s.pctRecep,s.pctEnvio)}
      <div class="mon-legend">
        <span><span class="dot" style="background:${MON_COLORS.verdeDk};"></span>Recepción</span>
        <span><span class="dot" style="background:${MON_COLORS.negro};"></span>Enviado</span>
      </div>
      <div class="mon-avgpills">
        <div class="mon-avgpill">Prom. recepción: <b>${fmtHora(s.avgHourRecep)}</b></div>
        <div class="mon-avgpill">Prom. envío: <b>${fmtHora(s.avgHourEnvio)}</b></div>
      </div>
    </div>

    <div class="card mon-card">
      <div class="card-head" style="margin-bottom:8px;"><h2 style="font-size:14px;">Tiempo promedio por solicitante</h2><div class="sub" style="font-size:11px;">Recepción → Enviado</div></div>
      <div class="rank-list">${rankingHtml}</div>
    </div>
  </div>`;
}

function applyMonitor(){
  mFEmp=document.getElementById('mFEmp')?.value||'';
  mFSol=document.getElementById('mFSol')?.value||'';
  mFMes=document.getElementById('mFMes')?.value||'';
  renderMonitorDashboard(window.__monitorRecs||[]);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
iniciar();
</script>
</body>
</html>
