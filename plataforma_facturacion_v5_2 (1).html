<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa de Facturación · Tándem</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ─── TÁNDEM BRAND PALETTE ─────────────────────────────────────────────────── */
:root{
  --verde:    #C5EC4C;   /* Pantone 2297C */
  --negro:    #232323;   /* Pantone Black 7C */
  --gris:     #E5E8DD;   /* Pantone 7534C */
  --verde-cl: #E0ECBB;   /* Pantone 2274C */
  --verde-dk: #8FB520;   /* darker lime for hover/active */
  --blanco:   #FFFFFF;
  --muted:    #5C6B3A;
  --red:      #B3443A;
  --red-bg:   #F8E7E4;
  --green-ok: #3E7C2B;
  --green-bg: #EBF5D6;
  --amber:    #D98E3F;
  --amber-bg: #FDF3E3;
  --mono: 'Courier New', monospace;
  --sans: 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--gris);color:var(--negro);min-height:100vh;}

/* ─── TOP BAR ──────────────────────────────────────────────────────────────── */
.topbar{
  background:var(--negro); color:var(--verde);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; height:52px; position:sticky; top:0; z-index:100;
}
.topbar .logo{font-size:20px; font-weight:700; letter-spacing:-.02em;}
.topbar .logo span{color:var(--verde);}
.topbar .tagline{font-size:10.5px; color:var(--gris); letter-spacing:.1em; text-transform:uppercase;}
.topbar .right{display:flex; align-items:center; gap:14px;}
.user-chip{
  font-family:var(--mono); font-size:11px; color:var(--verde);
  display:flex; align-items:center; gap:8px;
}
.user-avatar{
  width:28px; height:28px; border-radius:50%; background:var(--verde);
  color:var(--negro); display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:11px;
}
.badge-admin{
  font-size:9.5px; background:var(--verde); color:var(--negro);
  padding:2px 7px; border-radius:10px; font-weight:700; letter-spacing:.05em;
}
.logout-btn{
  font-size:11px; color:var(--gris); background:none; border:none;
  cursor:pointer; text-decoration:underline; font-family:var(--sans);
}
.sp-dot{
  font-family:var(--mono); font-size:10px; padding:3px 9px; border-radius:3px;
  border:1px solid #444;
}
.sp-dot.ok{border-color:var(--verde); color:var(--verde);}
.sp-dot.local{border-color:var(--amber); color:var(--amber);}
.sp-dot.loading{border-color:#666; color:#888;}

/* ─── NAV TABS ─────────────────────────────────────────────────────────────── */
.navtabs{
  background:var(--negro); border-top:1px solid #3a3a3a;
  display:flex; padding:0 28px; gap:4px;
}
.navtab{
  font-family:var(--mono); font-size:12px; padding:10px 18px;
  color:var(--gris); background:none; border:none; cursor:pointer;
  border-bottom:3px solid transparent; transition:.15s;
}
.navtab:hover{color:var(--verde);}
.navtab.active{color:var(--verde); border-bottom-color:var(--verde); font-weight:600;}
.navtab.admin-tab{color:var(--amber);}
.navtab.admin-tab.active{color:var(--amber); border-bottom-color:var(--amber);}

/* ─── APP WRAPPER ───────────────────────────────────────────────────────────── */
.app{max-width:1000px; margin:0 auto; padding:28px 20px 60px;}

/* ─── LOGIN ─────────────────────────────────────────────────────────────────── */
.login-page{
  min-height:calc(100vh - 52px);
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--negro) 0%, #3a4a1a 100%);
}
.login-card{
  background:var(--blanco); border-radius:8px; padding:40px 36px;
  width:100%; max-width:400px; box-shadow:0 8px 40px rgba(0,0,0,.3);
}
.login-logo{
  font-size:28px; font-weight:700; color:var(--negro); margin-bottom:4px;
  display:flex; align-items:center; gap:10px;
}
.login-logo .dot{
  width:36px; height:36px; background:var(--verde); border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:14px;
}
.login-sub{font-size:13px; color:var(--muted); margin-bottom:28px;}
.login-divider{height:3px; background:var(--verde); margin-bottom:24px; border-radius:2px;}
label.fl{display:block; font-size:12px; font-weight:600; color:var(--negro); margin-bottom:6px; letter-spacing:.02em;}
input[type=text],select,textarea{
  width:100%; padding:11px 13px; border:1px solid #d0d8c0; border-radius:4px;
  font-family:var(--sans); font-size:14px; color:var(--negro); background:#fff;
  transition:.15s;
}
input:focus,select:focus,textarea:focus{
  outline:2px solid var(--verde); outline-offset:1px; border-color:var(--verde);
}
textarea{min-height:72px; resize:vertical;}
.err-msg{
  background:var(--red-bg); border-left:3px solid var(--red); color:var(--red);
  padding:9px 13px; font-size:13px; border-radius:0 4px 4px 0;
  margin-top:10px; display:none;
}
.err-msg.show{display:block;}

/* ─── BUTTONS ───────────────────────────────────────────────────────────────── */
.btn{
  font-family:var(--mono); font-size:13px; padding:11px 24px; border-radius:4px;
  border:2px solid var(--negro); background:var(--blanco); color:var(--negro);
  cursor:pointer; transition:.15s; font-weight:600;
}
.btn.primary{background:var(--negro); color:var(--verde); border-color:var(--negro);}
.btn.primary:hover{background:var(--verde-dk); border-color:var(--verde-dk); color:var(--negro);}
.btn.primary:disabled{background:#aaa; border-color:#aaa; color:#fff; cursor:not-allowed;}
.btn.verde{background:var(--verde); color:var(--negro); border-color:var(--verde);}
.btn.verde:hover{background:var(--verde-dk); border-color:var(--verde-dk);}
.btn.ghost{border-color:transparent; color:var(--muted); background:none;}
.btn.ghost:hover{color:var(--negro);}
.btn.sm{padding:7px 14px; font-size:11.5px;}
.nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:20px;}

/* ─── CARDS ──────────────────────────────────────────────────────────────────── */
.card{
  background:var(--blanco); border:1px solid #d0d8c0; border-radius:6px;
  padding:24px; margin-bottom:16px;
}
.card-head{
  border-left:4px solid var(--verde); padding-left:12px; margin-bottom:16px;
}
.card-head h2{font-size:17px; color:var(--negro);}
.card-head .sub{font-size:13px; color:var(--muted); margin-top:2px;}

/* ─── STEPPER ───────────────────────────────────────────────────────────────── */
.stepper{display:flex; margin-bottom:24px; gap:0;}
.snode{flex:1; padding-top:10px;}
.snode .bar{height:4px; background:#d0d8c0; border-radius:2px;}
.snode.done .bar,.snode.active .bar{background:var(--verde);}
.snode.done .bar{background:var(--verde-dk);}
.snode .lbl{font-family:var(--mono); font-size:10.5px; margin-top:7px; color:#888; text-transform:uppercase; letter-spacing:.05em;}
.snode.active .lbl{color:var(--negro); font-weight:700;}
.snode.done .lbl{color:var(--verde-dk);}

/* ─── CLIENT TAG ─────────────────────────────────────────────────────────────── */
.client-tag{
  display:inline-flex; align-items:center; gap:10px;
  background:var(--negro); color:var(--verde); padding:6px 14px;
  border-radius:4px; font-family:var(--mono); font-size:12px; margin-top:10px;
}
.client-tag .cid{color:var(--verde-cl);}

/* ─── MANIFEST (doc checklist) ───────────────────────────────────────────────── */
.manifest{border:1px solid #d0d8c0; border-radius:6px; overflow:hidden; margin-top:10px;}
.manifest-head{
  background:var(--negro); color:var(--verde);
  padding:10px 16px; font-family:var(--mono); font-size:11px;
  letter-spacing:.06em; text-transform:uppercase;
  display:flex; justify-content:space-between;
}
.doc-row{display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--gris);}
.doc-row:last-child{border-bottom:none;}
.doc-row:nth-child(even){background:#fafcf5;}
.stamp{
  width:36px; height:36px; border-radius:50%; border:2px solid #d0d8c0;
  display:flex; align-items:center; justify-content:center; font-size:17px;
  flex-shrink:0; background:#fff; color:#aaa;
}
.doc-row.ok .stamp{border-color:var(--green-ok); color:var(--green-ok); background:var(--green-bg);}
.doc-row.err .stamp{border-color:var(--red); color:var(--red); background:var(--red-bg);}
.doc-info{flex:1; min-width:0;}
.doc-info .dname{font-weight:600; font-size:14px; color:var(--negro);}
.req-tag{font-family:var(--mono); font-size:10px; color:var(--amber); margin-left:8px; text-transform:uppercase;}
.status-msg{font-size:12.5px; margin-top:3px; color:#888;}
.doc-row.ok .status-msg{color:var(--green-ok);}
.doc-row.err .status-msg{color:var(--red);}
input[type=file]{display:none;}
.ubtn{
  font-family:var(--mono); font-size:11.5px; padding:8px 14px;
  border:1.5px solid var(--negro); background:var(--blanco); border-radius:3px;
  cursor:pointer; white-space:nowrap; transition:.15s;
}
.ubtn:hover{background:var(--negro); color:var(--verde);}
.blocker{
  background:var(--red-bg); border-left:3px solid var(--red); color:var(--red);
  border-radius:0 4px 4px 0; padding:10px 14px; font-size:13px;
  margin-top:14px; display:none;
}
.blocker.show{display:block;}

/* ─── TICKET / CONFIRMACIÓN ─────────────────────────────────────────────────── */
.ticket{
  border:3px solid var(--verde); border-radius:8px; padding:36px 28px;
  text-align:center; background:var(--blanco);
}
.tick-icon{
  width:56px; height:56px; border-radius:50%; background:var(--verde);
  color:var(--negro); display:flex; align-items:center; justify-content:center;
  font-size:28px; margin:0 auto 14px; font-weight:700;
}
.tick-id{font-family:var(--mono); font-size:26px; font-weight:700; color:var(--negro); margin:8px 0;}
.tick-sub{font-size:13.5px; color:var(--muted);}

/* ─── ADMIN PANEL ───────────────────────────────────────────────────────────── */
.kpi-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px;}
.kpi{border-radius:8px; padding:18px; text-align:center; border:1px solid #d0d8c0;}
.kpi .kpi-label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px;}
.kpi .kpi-val{font-size:32px; font-weight:700;}
.kpi.pend{background:var(--amber-bg);} .kpi.pend .kpi-label{color:var(--amber);} .kpi.pend .kpi-val{color:var(--amber);}
.kpi.proc{background:#DCE6F5;} .kpi.proc .kpi-label{color:#2A4D8F;} .kpi.proc .kpi-val{color:#2A4D8F;}
.kpi.fact{background:var(--green-bg);} .kpi.fact .kpi-label{color:var(--green-ok);} .kpi.fact .kpi-val{color:var(--green-ok);}

/* ─── TABLE ──────────────────────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; font-family:var(--mono); font-size:10px; text-transform:uppercase;
  letter-spacing:.05em; color:var(--blanco); background:var(--negro);
  padding:9px 12px; white-space:nowrap;
}
td{padding:10px 12px; border-bottom:1px solid var(--gris); vertical-align:top;}
tr:hover td{background:#f5fae8;}
.pill{font-family:var(--mono); font-size:10px; padding:3px 9px; border-radius:10px; text-transform:uppercase; white-space:nowrap;}
.pill-pend{background:var(--amber-bg); color:var(--amber);}
.pill-proc{background:#DCE6F5; color:#2A4D8F;}
.pill-fact{background:var(--green-bg); color:var(--green-ok);}
.doc-pill{display:inline-block; font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:3px; margin:2px; background:var(--green-bg); color:var(--green-ok);}
.filters{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.filters select{width:auto; min-width:160px;}
.ss{font-family:var(--mono); font-size:11px; padding:4px 8px; border:1px solid #d0d8c0; border-radius:3px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:600px){.grid2{grid-template-columns:1fr;} .kpi-grid{grid-template-columns:1fr;}}
details summary{cursor:pointer; font-family:var(--mono); font-size:11.5px; color:var(--muted);}
.dl-link{font-size:11.5px; color:var(--negro); text-decoration:underline; cursor:pointer; display:block; margin-top:3px;}
.info-bar{
  background:var(--verde-cl); border:1px solid #c0d8a0; border-radius:4px;
  padding:9px 14px; font-size:12.5px; color:var(--negro); margin-bottom:14px;
}
</style>
</head>

</div>

// ─── SP HELPERS ───────────────────────────────────────────────────────────────
async function spGet(url){
  const r=await fetch(url,{headers:{'Accept':'application/json;odata=verbose'},credentials:'include'});
  if(!r.ok) throw new Error('SP '+r.status);
  const j=await r.json(); return j.d?.results??j.value??j;
}
async function getDigest(){
  const r=await fetch(`${SP_SITE}/_api/contextinfo`,{method:'POST',headers:{'Accept':'application/json;odata=verbose'},credentials:'include'});
  const j=await r.json(); return j.d?.GetContextWebInformation?.FormDigestValue??j.FormDigestValue;
}
async function spAddItem(list,data){
  const meta=await spGet(`${SP_API}('${list}')?$select=ListItemEntityTypeFullName`);
  const type=meta.d?.ListItemEntityTypeFullName??meta.ListItemEntityTypeFullName;
  const digest=await getDigest();
  const r=await fetch(`${SP_API}('${list}')/items`,{
    method:'POST',credentials:'include',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose','X-RequestDigest':digest},
    body:JSON.stringify({__metadata:{type},...data})
  });
  if(!r.ok){const t=await r.text();throw new Error('AddItem '+r.status+' '+t.slice(0,200));}
  return r.json();
}
async function spUpdateItem(list,id,data){
  const digest=await getDigest();
  await fetch(`${SP_API}('${list}')/items(${id})`,{
    method:'MERGE',credentials:'include',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose',
      'X-RequestDigest':digest,'IF-MATCH':'*','X-HTTP-Method':'MERGE'},
    body:JSON.stringify({__metadata:{type:`SP.Data.${list}ListItem`},...data})
  });
}

async function loadSpData(){
  spStatus='loading'; renderSpDot();
  try{
    const[solic,emp,cli,reg]=await Promise.all([
      spGet(`${SP_API}('Solicitantes')/items?$select=Title,Activo,Correo&$top=200`),
      spGet(`${SP_API}('Empresas')/items?$select=Title,Activo&$top=50`),
      spGet(`${SP_API}('ClientesPorSolicitante')/items?$select=Title,NombreCliente,IDCliente,Empresa&$top=500`),
      spGet(`${SP_API}('ReglasDocumentos')/items?$select=IDCliente,NombreCliente,Plantilla,OC,HES,ActaConformidad,ExcelLiquidacion,AceptacionServicio,CDR,Adicionales,Notas&$top=500`),
    ]);
    spData={
      solicitantes:solic.map(r=>[r.Title,r.Activo?'Si':'No',r.Correo]),
      empresas:emp.map(r=>[r.Title,r.Activo?'Si':'No']),
      clientes:cli.map(r=>[r.Title,r.NombreCliente,r.IDCliente,r.Empresa]),
      reglas:reg.map(r=>[r.IDCliente,r.NombreCliente,r.Plantilla?'Si':'No',r.OC?'Si':'No',r.HES?'Si':'No',r.ActaConformidad?'Si':'No',r.ExcelLiquidacion?'Si':'No',r.AceptacionServicio?'Si':'No',r.CDR?'Si':'No',r.Adicionales?'Si':'No',r.Notas])
    };
    spStatus='ok';
  }catch(e){
    console.warn('SP offline, usando datos locales:',e.message);
    spData={solicitantes:SPDATA.solicitantes,empresas:SPDATA.empresas,clientes:SPDATA.clientes,reglas:SPDATA.reglas};
    spStatus='local';
  }
  renderSpDot();
  if(user) renderCurrentTab();
}

function renderSpDot(){
  const d=document.getElementById('spDot'); if(!d) return;
  const map={ok:'● SharePoint',local:'● Datos locales',loading:'● conectando…',idle:'● —'};
  const cls={ok:'ok',local:'local',loading:'loading',idle:'loading'};
  d.className='sp-dot '+(cls[spStatus]||'');
  d.textContent=map[spStatus]||'';
}

function data(){return spData||SPDATA;}
function clientesFor(n){return data().clientes.filter(c=>c[0]===n);}
function reglaFor(id){return data().reglas.find(r=>r[0]===id);}
function reqDocs(id){
  const r=reglaFor(id); if(!r) return [];
  return DOC_TYPES.filter(dt=>{const i=REGLA_COLS.indexOf(dt.key); return r[i]==='Si'||r[i]===true;});
}
function clienteRow(){return data().clientes.find(c=>c[2]===st.idCliente);}
function isAdmin(){return user&&ADMINS.includes(user.nombre);}
function initials(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── STEPPER ─────────────────────────────────────────────────────────────────
function stepperHtml(){
  const labels=['Cliente','Documentos','Confirmar'];
  return '<div class="stepper">'+labels.map((l,i)=>{
    const n=i+1,c=n<st.step?'done':n===st.step?'active':'';
    return `<div class="snode ${c}"><div class="bar"></div><div class="lbl">${n}. ${l}</div></div>`;
  }).join('')+'</div>';
}

// ─── FILE VALIDATION ──────────────────────────────────────────────────────────
function handleFile(key,file){
  if(!file) return;
  if(file.size>MAX_FILE){st.docs[key]={fileName:file.name,sizeKB:Math.round(file.size/1024),base64:null,validation:{ok:false,msg:'Archivo demasiado grande (máx. 1.8 MB).'}};renderNew();return;}
  const reader=new FileReader();
  reader.onload=async e=>{
    const b64=e.target.result;
    const dt=DOC_TYPES.find(d=>d.key===key);
    const sKB=Math.round(file.size/1024);
    let v;
    if(dt.kind==='xlsx') v=await validateXlsx(b64);
    else if(dt.kind==='xlsx_gen') v=/\.(xlsx|xls)$/i.test(file.name)?{ok:true,msg:'Excel cargado'}:{ok:false,msg:'Debe ser .xlsx o .xls'};
    else if(dt.kind==='pdf_kw') v=await validatePdfKw(file,b64,key);
    else v={ok:true,msg:'Archivo cargado'};
    st.docs[key]={fileName:file.name,sizeKB:sKB,base64:b64,validation:v};
    renderNew();
  };
  reader.readAsDataURL(file);
}

async function validateXlsx(b64){
  try{
    const wb=XLSX.read(b64.split(',')[1],{type:'base64'});
    if(!wb.SheetNames?.length) return {ok:false,msg:'Excel vacío o ilegible.'};
    const ws=wb.Sheets[wb.SheetNames[0]];
    const allRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    const flat=allRows.flat().map(c=>String(c).toUpperCase().trim());

    // ── Verify it's the official Tándem plantilla ──
    const missingFirma=PLANTILLA_FIRMA.filter(f=>!flat.some(c=>c.includes(f.toUpperCase())));
    if(missingFirma.length>0){
      return {ok:false,msg:`Este no es el formato oficial de plantilla. Usa la plantilla proporcionada por el equipo de facturación (faltan: ${missingFirma.join(', ')}).`};
    }

    // ── Extract key fields ──
    let razonSocial='',ruc='',mes='',importe='',oc='',engagement='',cebe='';
    allRows.forEach(r=>{
      const v=r.map(c=>String(c).trim());
      const vu=v.map(x=>x.toUpperCase());
      if(vu.some(x=>x.includes('RAZÓN SOCIAL')||x.includes('RAZON SOCIAL')))
        razonSocial=v.find(x=>x.length>3&&!x.toUpperCase().includes('SOCIAL')&&!x.toUpperCase().includes('RAZÓN'))||'';
      if(vu.includes('RUC'))
        ruc=v.find(x=>/^[0-9]{11}$/.test(x))||'';
      if(vu.some(x=>x.includes('FECHA')))
        mes=v.find(x=>x.match(/\d{2}\/\d{2}\/\d{4}/)||x.match(/\d{4}-\d{2}-\d{2}/))||'';
      if(vu.some(x=>x.includes('TOTAL :')))
        importe=v.filter(x=>/^[0-9,.]+$/.test(x)&&parseFloat(x.replace(',',''))>0).pop()||'';
      if(vu.some(x=>x.includes('ENGAGEMENT')))
        engagement=v.find(x=>x.length>2&&!x.toUpperCase().includes('ENGAGEMENT'))||'';
      if(vu.some(x=>x.includes('CEBE')||x.includes('CENTRO DE COSTO')))
        cebe=v.find(x=>x.length>2&&!x.toUpperCase().includes('CEBE')&&!x.toUpperCase().includes('CENTRO'))||'';
      // Look for OC/PO reference in glosa
      if(vu.some(x=>x.includes('GLOSA')||x.includes('DESCRIPCIÓN'))){
        const glosaRow=v.find(x=>x.toUpperCase().includes('OC ')||x.toUpperCase().includes('PO ')||x.match(/OC[\s-]?[0-9]+/i));
        if(glosaRow){const m=glosaRow.match(/(?:OC|PO)[\s-]?([0-9A-Z-]+)/i);if(m)oc=m[1];}
      }
      // Also find OC in observation row
      v.forEach(x=>{const m=x.match(/(?:OC|PO)[\s-]?([0-9A-Z-]+)/i);if(m&&!oc)oc=m[1];});
    });

    // ── Validate client matches ──
    if(!SKIP_VAL.includes(user?.nombre)&&st.idCliente){
      const cr=clienteRow();
      if(cr&&razonSocial){
        const clientWords=cr[1].toUpperCase().split(' ').filter(w=>w.length>3);
        const rsUpper=razonSocial.toUpperCase();
        const match=clientWords.some(w=>rsUpper.includes(w));
        if(!match) return {ok:false,msg:`La Razón Social en la plantilla ("${razonSocial}") no coincide con el cliente seleccionado ("${cr[1]}"). Verifica que estás subiendo la plantilla correcta.`};
      }
    }

    // Store extracted data for cross-validation with other docs
    window.__plantillaData={razonSocial,ruc,mes,importe,oc,engagement,cebe};

    let info=[];
    if(razonSocial) info.push('Cliente: '+razonSocial);
    if(ruc) info.push('RUC: '+ruc);
    if(importe) info.push('Total: S/ '+importe);
    if(oc) info.push('OC/PO: '+oc);
    if(mes) info.push('Fecha: '+mes);
    return {ok:true,msg:'✓ Plantilla oficial válida — '+info.join(' · ')};
  }catch(e){return {ok:false,msg:'No se pudo leer el Excel. Verifica que no esté dañado.'};}}="width=device-width, initial-scale=1.0">

  padding:9px 14px; font-size:12.5px; color:var(--negro); margin-bottom:14px;
}

// ─── SP HELPERS ───────────────────────────────────────────────────────────────
async function spGet(url){
  const r=await fetch(url,{headers:{'Accept':'application/json;odata=verbose'},credentials:'include'});
  if(!r.ok) throw new Error('SP '+r.status);
  const j=await r.json(); return j.d?.results??j.value??j;
}
async function getDigest(){
  const r=await fetch(`${SP_SITE}/_api/contextinfo`,{method:'POST',headers:{'Accept':'application/json;odata=verbose'},credentials:'include'});
  const j=await r.json(); return j.d?.GetContextWebInformation?.FormDigestValue??j.FormDigestValue;
}
async function spAddItem(list,data){
  const meta=await spGet(`${SP_API}('${list}')?$select=ListItemEntityTypeFullName`);
  const type=meta.d?.ListItemEntityTypeFullName??meta.ListItemEntityTypeFullName;
  const digest=await getDigest();
  const r=await fetch(`${SP_API}('${list}')/items`,{
    method:'POST',credentials:'include',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose','X-RequestDigest':digest},
    body:JSON.stringify({__metadata:{type},...data})
  });
  if(!r.ok){const t=await r.text();throw new Error('AddItem '+r.status+' '+t.slice(0,200));}
  return r.json();
}
async function spUpdateItem(list,id,data){
  const digest=await getDigest();
  await fetch(`${SP_API}('${list}')/items(${id})`,{
    method:'MERGE',credentials:'include',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose',
      'X-RequestDigest':digest,'IF-MATCH':'*','X-HTTP-Method':'MERGE'},
    body:JSON.stringify({__metadata:{type:`SP.Data.${list}ListItem`},...data})
  });
}

async function loadSpData(){
  spStatus='loading'; renderSpDot();
  try{
    const[solic,emp,cli,reg]=await Promise.all([
      spGet(`${SP_API}('Solicitantes')/items?$select=Title,Activo,Correo&$top=200`),
      spGet(`${SP_API}('Empresas')/items?$select=Title,Activo&$top=50`),
      spGet(`${SP_API}('ClientesPorSolicitante')/items?$select=Title,NombreCliente,IDCliente,Empresa&$top=500`),
      spGet(`${SP_API}('ReglasDocumentos')/items?$select=IDCliente,NombreCliente,Plantilla,OC,HES,ActaConformidad,ExcelLiquidacion,AceptacionServicio,CDR,Adicionales,Notas&$top=500`),
    ]);
    spData={
      solicitantes:solic.map(r=>[r.Title,r.Activo?'Si':'No',r.Correo]),
      empresas:emp.map(r=>[r.Title,r.Activo?'Si':'No']),
      clientes:cli.map(r=>[r.Title,r.NombreCliente,r.IDCliente,r.Empresa]),
      reglas:reg.map(r=>[r.IDCliente,r.NombreCliente,r.Plantilla?'Si':'No',r.OC?'Si':'No',r.HES?'Si':'No',r.ActaConformidad?'Si':'No',r.ExcelLiquidacion?'Si':'No',r.AceptacionServicio?'Si':'No',r.CDR?'Si':'No',r.Adicionales?'Si':'No',r.Notas])
    };
    spStatus='ok';
  }catch(e){
    console.warn('SP offline, usando datos locales:',e.message);
    spData={solicitantes:SPDATA.solicitantes,empresas:SPDATA.empresas,clientes:SPDATA.clientes,reglas:SPDATA.reglas};
    spStatus='local';
  }
  renderSpDot();
  if(user) renderCurrentTab();
}

function renderSpDot(){
  const d=document.getElementById('spDot'); if(!d) return;
  const map={ok:'● SharePoint',local:'● Datos locales',loading:'● conectando…',idle:'● —'};
  const cls={ok:'ok',local:'local',loading:'loading',idle:'loading'};
  d.className='sp-dot '+(cls[spStatus]||'');
  d.textContent=map[spStatus]||'';
}

function data(){return spData||SPDATA;}
function clientesFor(n){return data().clientes.filter(c=>c[0]===n);}
function reglaFor(id){return data().reglas.find(r=>r[0]===id);}
function reqDocs(id){
  const r=reglaFor(id); if(!r) return [];
  return DOC_TYPES.filter(dt=>{const i=REGLA_COLS.indexOf(dt.key); return r[i]==='Si'||r[i]===true;});
}
function clienteRow(){return data().clientes.find(c=>c[2]===st.idCliente);}
function isAdmin(){return user&&ADMINS.includes(user.nombre);}
function initials(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── STEPPER ─────────────────────────────────────────────────────────────────
function stepperHtml(){
  const labels=['Cliente','Documentos','Confirmar'];
  return '<div class="stepper">'+labels.map((l,i)=>{
    const n=i+1,c=n<st.step?'done':n===st.step?'active':'';
    return `<div class="snode ${c}"><div class="bar"></div><div class="lbl">${n}. ${l}</div></div>`;
  }).join('')+'</div>';
}

// ─── FILE VALIDATION ──────────────────────────────────────────────────────────
function handleFile(key,file){
  if(!file) return;
  if(file.size>MAX_FILE){st.docs[key]={fileName:file.name,sizeKB:Math.round(file.size/1024),base64:null,validation:{ok:false,msg:'Archivo demasiado grande (máx. 1.8 MB).'}};renderNew();return;}
  const reader=new FileReader();
  reader.onload=async e=>{
    const b64=e.target.result;
    const dt=DOC_TYPES.find(d=>d.key===key);
    const sKB=Math.round(file.size/1024);
    let v;
    if(dt.kind==='xlsx') v=await validateXlsx(b64);
    else if(dt.kind==='xlsx_gen') v=/\.(xlsx|xls)$/i.test(file.name)?{ok:true,msg:'Excel cargado'}:{ok:false,msg:'Debe ser .xlsx o .xls'};
    else if(dt.kind==='pdf_kw') v=await validatePdfKw(file,b64,key);
    else v={ok:true,msg:'Archivo cargado'};
    st.docs[key]={fileName:file.name,sizeKB:sKB,base64:b64,validation:v};
    renderNew();
  };
  reader.readAsDataURL(file);
}

async function validateXlsx(b64){
  try{
    const wb=XLSX.read(b64.split(',')[1],{type:'base64'});
    if(!wb.SheetNames?.length) return {ok:false,msg:'Excel vacío o ilegible.'};
    const ws=wb.Sheets[wb.SheetNames[0]];
    const allRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    const flat=allRows.flat().map(c=>String(c).toUpperCase());
    const isOF=flat.some(c=>c.includes('ORDEN DE FACTURACIÓN')||c.includes('ORDEN DE FACTURACION'));
    const hasRS=flat.some(c=>c.includes('RAZON SOCIAL')||c.includes('RAZÓN SOCIAL'));
    const hasRUC=flat.some(c=>c==='RUC'||c.includes('RUC:'));
    if(isOF&&hasRS&&hasRUC){
      if(!SKIP_VAL.includes(user?.nombre)&&st.idCliente){
        const cr=clienteRow();
        if(cr){
          const cn=cr[1].toUpperCase().split(' ').slice(0,2).join(' ');
          if(!flat.some(c=>c.includes(cn.substring(0,6)))){
            return {ok:false,msg:`La plantilla no corresponde al cliente seleccionado "${cr[1]}". Verifica que estás subiendo la plantilla correcta.`};
          }
        }
      }
      let rs='',ruc='',total='';
      allRows.forEach(r=>{
        const v=r.map(c=>String(c).trim());
        if(v.some(x=>x.toUpperCase().includes('RAZON SOCIAL')||x.toUpperCase().includes('RAZÓN SOCIAL')))
          rs=v.find(x=>x.length>4&&!x.toUpperCase().includes('RAZON')&&!x.toUpperCase().includes('SOCIAL'))||'';
        if(v.some(x=>x.toUpperCase()==='RUC'))
          ruc=v.find(x=>x.length>5&&/^[0-9]+$/.test(x))||'';
        if(v.some(x=>x.toUpperCase().includes('TOTAL :')))
          total=v.filter(x=>/^[0-9.,]+$/.test(x)).pop()||'';
      });
      return {ok:true,msg:`✓ Plantilla válida${rs?' · '+rs:''}${ruc?' · RUC: '+ruc:''}${total?' · Total: S/ '+total:''}`};
    }
    // Generic Excel — accept any readable Excel with data
    const nonEmpty=allRows.filter(r=>r.some(c=>String(c).trim()!==''));
    if(nonEmpty.length<1) return {ok:false,msg:'El Excel parece vacío. Verifica que tenga datos.'};
    return {ok:true,msg:`Excel cargado — ${nonEmpty.length} filas detectadas (hoja "${wb.SheetNames[0]}"). Verifica que sea el documento correcto.`};
  }catch(e){return {ok:false,msg:'No se pudo leer el Excel. Verifica que no esté dañado o en formato .xls antiguo — guárdalo como .xlsx e intenta de nuevo.'};}}

async function validatePdfKw(file,b64,key){
  const isPdf=/\.pdf$/i.test(file.name);
  const isXls=/\.(xlsx|xls)$/i.test(file.name);
  if(!isPdf&&!isXls) return {ok:false,msg:'Formato no válido. Se esperaba PDF o Excel.'};
  if(isPdf){
    try{
      const arr=Uint8Array.from(atob(b64.split(',')[1]),c=>c.charCodeAt(0));
      const hdr=new TextDecoder('utf-8',{fatal:false}).decode(arr.slice(0,5));
      if(!hdr.startsWith('%PDF')) return {ok:false,msg:'El archivo no es un PDF válido.'};
      const txt=new TextDecoder('utf-8',{fatal:false}).decode(arr).toLowerCase();
      const kws=KW_MAP[key]||[];
      const foundKw=kws.find(k=>txt.includes(k));
      // Cross-validate against plantilla data
      const pd=window.__plantillaData;
      if(pd&&!SKIP_VAL.includes(user?.nombre)){
        const warnings=[];
        if(pd.oc&&key==='OC'){
          const ocNum=pd.oc.replace(/[^0-9]/g,'');
          if(ocNum.length>3&&!txt.includes(ocNum)&&!txt.includes(pd.oc.toLowerCase()))
            warnings.push('N° OC/PO "'+pd.oc+'" no encontrado en el documento');
        }
        if(pd.razonSocial&&['OC','HES','ActaConformidad'].includes(key)){
          const rsWords=pd.razonSocial.toUpperCase().split(' ').filter(w=>w.length>4);
          if(rsWords.length>0&&!rsWords.some(w=>txt.toUpperCase().includes(w)))
            warnings.push('No se detectó referencia al cliente "'+pd.razonSocial+'"');
        }
        if(warnings.length>0)
          return {ok:false,msg:'⚠ Inconsistencia con la plantilla: '+warnings.join('; ')+'. Verifica que los documentos correspondan a la misma operación.'};
      }
      if(foundKw) return {ok:true,msg:'✓ PDF válido — se detectó "'+foundKw+'".'};
      const hasText=txt.match(/[a-z]{4,}/g)?.length>10;
      if(!hasText) return {ok:true,msg:'PDF cargado (escaneado — verifica visualmente que corresponda a la misma operación de la plantilla).'};
      return {ok:true,msg:'PDF cargado. Verifica que corresponda a la misma operación de la plantilla.'};
    }catch(e){return {ok:false,msg:'No se pudo leer el PDF.'};}}
  return {ok:true,msg:'Archivo Excel cargado.'};}}rset="UTF-8">

// ─── SP HELPERS ───────────────────────────────────────────────────────────────
async function spGet(url){
  const r=await fetch(url,{headers:{'Accept':'application/json;odata=verbose'},credentials:'include'});
  if(!r.ok) throw new Error('SP '+r.status);
  const j=await r.json(); return j.d?.results??j.value??j;
}
async function getDigest(){
  const r=await fetch(`${SP_SITE}/_api/contextinfo`,{method:'POST',headers:{'Accept':'application/json;odata=verbose'},credentials:'include'});
  const j=await r.json(); return j.d?.GetContextWebInformation?.FormDigestValue??j.FormDigestValue;
}
async function spAddItem(list,data){
  const meta=await spGet(`${SP_API}('${list}')?$select=ListItemEntityTypeFullName`);
  const type=meta.d?.ListItemEntityTypeFullName??meta.ListItemEntityTypeFullName;
  const digest=await getDigest();
  const r=await fetch(`${SP_API}('${list}')/items`,{
    method:'POST',credentials:'include',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose','X-RequestDigest':digest},
    body:JSON.stringify({__metadata:{type},...data})
  });
  if(!r.ok){const t=await r.text();throw new Error('AddItem '+r.status+' '+t.slice(0,200));}
  return r.json();
}
async function spUpdateItem(list,id,data){
  const digest=await getDigest();
  await fetch(`${SP_API}('${list}')/items(${id})`,{
    method:'MERGE',credentials:'include',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose',
      'X-RequestDigest':digest,'IF-MATCH':'*','X-HTTP-Method':'MERGE'},
    body:JSON.stringify({__metadata:{type:`SP.Data.${list}ListItem`},...data})
  });
}

async function loadSpData(){
  spStatus='loading'; renderSpDot();
  try{
    const[solic,emp,cli,reg]=await Promise.all([
      spGet(`${SP_API}('Solicitantes')/items?$select=Title,Activo,Correo&$top=200`),
      spGet(`${SP_API}('Empresas')/items?$select=Title,Activo&$top=50`),
      spGet(`${SP_API}('ClientesPorSolicitante')/items?$select=Title,NombreCliente,IDCliente,Empresa&$top=500`),
      spGet(`${SP_API}('ReglasDocumentos')/items?$select=IDCliente,NombreCliente,Plantilla,OC,HES,ActaConformidad,ExcelLiquidacion,AceptacionServicio,CDR,Adicionales,Notas&$top=500`),
    ]);
    spData={
      solicitantes:solic.map(r=>[r.Title,r.Activo?'Si':'No',r.Correo]),
      empresas:emp.map(r=>[r.Title,r.Activo?'Si':'No']),
      clientes:cli.map(r=>[r.Title,r.NombreCliente,r.IDCliente,r.Empresa]),
      reglas:reg.map(r=>[r.IDCliente,r.NombreCliente,r.Plantilla?'Si':'No',r.OC?'Si':'No',r.HES?'Si':'No',r.ActaConformidad?'Si':'No',r.ExcelLiquidacion?'Si':'No',r.AceptacionServicio?'Si':'No',r.CDR?'Si':'No',r.Adicionales?'Si':'No',r.Notas])
    };
    spStatus='ok';
  }catch(e){
    console.warn('SP offline, usando datos locales:',e.message);
    spData={solicitantes:SPDATA.solicitantes,empresas:SPDATA.empresas,clientes:SPDATA.clientes,reglas:SPDATA.reglas};
    spStatus='local';
  }
  renderSpDot();
  if(user) renderCurrentTab();
}

function renderSpDot(){
  const d=document.getElementById('spDot'); if(!d) return;
  const map={ok:'● SharePoint',local:'● Datos locales',loading:'● conectando…',idle:'● —'};
  const cls={ok:'ok',local:'local',loading:'loading',idle:'loading'};
  d.className='sp-dot '+(cls[spStatus]||'');
  d.textContent=map[spStatus]||'';
}

function data(){return spData||SPDATA;}
function clientesFor(n){return data().clientes.filter(c=>c[0]===n);}
function reglaFor(id){return data().reglas.find(r=>r[0]===id);}
function reqDocs(id){
  const r=reglaFor(id); if(!r) return [];
  return DOC_TYPES.filter(dt=>{const i=REGLA_COLS.indexOf(dt.key); return r[i]==='Si'||r[i]===true;});
}
function clienteRow(){return data().clientes.find(c=>c[2]===st.idCliente);}
function isAdmin(){return user&&ADMINS.includes(user.nombre);}
function initials(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── STEPPER ─────────────────────────────────────────────────────────────────
function stepperHtml(){
  const labels=['Cliente','Documentos','Confirmar'];
  return '<div class="stepper">'+labels.map((l,i)=>{
    const n=i+1,c=n<st.step?'done':n===st.step?'active':'';
    return `<div class="snode ${c}"><div class="bar"></div><div class="lbl">${n}. ${l}</div></div>`;
  }).join('')+'</div>';
}

// ─── FILE VALIDATION ──────────────────────────────────────────────────────────
function handleFile(key,file){
  if(!file) return;
  if(file.size>MAX_FILE){st.docs[key]={fileName:file.name,sizeKB:Math.round(file.size/1024),base64:null,validation:{ok:false,msg:'Archivo demasiado grande (máx. 1.8 MB).'}};renderNew();return;}
  const reader=new FileReader();
  reader.onload=async e=>{
    const b64=e.target.result;
    const dt=DOC_TYPES.find(d=>d.key===key);
    const sKB=Math.round(file.size/1024);
    let v;
    if(dt.kind==='xlsx') v=await validateXlsx(b64);
    else if(dt.kind==='xlsx_gen') v=/\.(xlsx|xls)$/i.test(file.name)?{ok:true,msg:'Excel cargado'}:{ok:false,msg:'Debe ser .xlsx o .xls'};
    else if(dt.kind==='pdf_kw') v=await validatePdfKw(file,b64,key);
    else v={ok:true,msg:'Archivo cargado'};
    st.docs[key]={fileName:file.name,sizeKB:sKB,base64:b64,validation:v};
    renderNew();
  };
  reader.readAsDataURL(file);
}

async function validateXlsx(b64){
  try{
    const wb=XLSX.read(b64.split(',')[1],{type:'base64'});
    if(!wb.SheetNames?.length) return {ok:false,msg:'Excel vacío o ilegible.'};
    const ws=wb.Sheets[wb.SheetNames[0]];
    const allRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    const flat=allRows.flat().map(c=>String(c).toUpperCase().trim());

    // ── Verify it's the official Tándem plantilla ──
    const missingFirma=PLANTILLA_FIRMA.filter(f=>!flat.some(c=>c.includes(f.toUpperCase())));
    if(missingFirma.length>0){
      return {ok:false,msg:`Este no es el formato oficial de plantilla. Usa la plantilla proporcionada por el equipo de facturación (faltan: ${missingFirma.join(', ')}).`};
    }

    // ── Extract key fields ──
    let razonSocial='',ruc='',mes='',importe='',oc='',engagement='',cebe='';
    allRows.forEach(r=>{
      const v=r.map(c=>String(c).trim());
      const vu=v.map(x=>x.toUpperCase());
      if(vu.some(x=>x.includes('RAZÓN SOCIAL')||x.includes('RAZON SOCIAL')))
        razonSocial=v.find(x=>x.length>3&&!x.toUpperCase().includes('SOCIAL')&&!x.toUpperCase().includes('RAZÓN'))||'';
      if(vu.includes('RUC'))
        ruc=v.find(x=>/^[0-9]{11}$/.test(x))||'';
      if(vu.some(x=>x.includes('FECHA')))
        mes=v.find(x=>x.match(/\d{2}\/\d{2}\/\d{4}/)||x.match(/\d{4}-\d{2}-\d{2}/))||'';
      if(vu.some(x=>x.includes('TOTAL :')))
        importe=v.filter(x=>/^[0-9,.]+$/.test(x)&&parseFloat(x.replace(',',''))>0).pop()||'';
      if(vu.some(x=>x.includes('ENGAGEMENT')))
        engagement=v.find(x=>x.length>2&&!x.toUpperCase().includes('ENGAGEMENT'))||'';
      if(vu.some(x=>x.includes('CEBE')||x.includes('CENTRO DE COSTO')))
        cebe=v.find(x=>x.length>2&&!x.toUpperCase().includes('CEBE')&&!x.toUpperCase().includes('CENTRO'))||'';
      // Look for OC/PO reference in glosa
      if(vu.some(x=>x.includes('GLOSA')||x.includes('DESCRIPCIÓN'))){
        const glosaRow=v.find(x=>x.toUpperCase().includes('OC ')||x.toUpperCase().includes('PO ')||x.match(/OC[\s-]?[0-9]+/i));
        if(glosaRow){const m=glosaRow.match(/(?:OC|PO)[\s-]?([0-9A-Z-]+)/i);if(m)oc=m[1];}
      }
      // Also find OC in observation row
      v.forEach(x=>{const m=x.match(/(?:OC|PO)[\s-]?([0-9A-Z-]+)/i);if(m&&!oc)oc=m[1];});
    });

    // ── Validate client matches ──
    if(!SKIP_VAL.includes(user?.nombre)&&st.idCliente){
      const cr=clienteRow();
      if(cr&&razonSocial){
        const clientWords=cr[1].toUpperCase().split(' ').filter(w=>w.length>3);
        const rsUpper=razonSocial.toUpperCase();
        const match=clientWords.some(w=>rsUpper.includes(w));
        if(!match) return {ok:false,msg:`La Razón Social en la plantilla ("${razonSocial}") no coincide con el cliente seleccionado ("${cr[1]}"). Verifica que estás subiendo la plantilla correcta.`};
      }
    }

    // Store extracted data for cross-validation with other docs
    window.__plantillaData={razonSocial,ruc,mes,importe,oc,engagement,cebe};

    let info=[];
    if(razonSocial) info.push('Cliente: '+razonSocial);
    if(ruc) info.push('RUC: '+ruc);
    if(importe) info.push('Total: S/ '+importe);
    if(oc) info.push('OC/PO: '+oc);
    if(mes) info.push('Fecha: '+mes);
    return {ok:true,msg:'✓ Plantilla oficial válida — '+info.join(' · ')};
  }catch(e){return {ok:false,msg:'No se pudo leer el Excel. Verifica que no esté dañado.'};}}="width=device-width, initial-scale=1.0">

  padding:9px 14px; font-size:12.5px; color:var(--negro); margin-bottom:14px;
}

// ─── SP HELPERS ───────────────────────────────────────────────────────────────
async function spGet(url){
  const r=await fetch(url,{headers:{'Accept':'application/json;odata=verbose'},credentials:'include'});
  if(!r.ok) throw new Error('SP '+r.status);
  const j=await r.json(); return j.d?.results??j.value??j;
}
async function getDigest(){
  const r=await fetch(`${SP_SITE}/_api/contextinfo`,{method:'POST',headers:{'Accept':'application/json;odata=verbose'},credentials:'include'});
  const j=await r.json(); return j.d?.GetContextWebInformation?.FormDigestValue??j.FormDigestValue;
}
async function spAddItem(list,data){
  const meta=await spGet(`${SP_API}('${list}')?$select=ListItemEntityTypeFullName`);
  const type=meta.d?.ListItemEntityTypeFullName??meta.ListItemEntityTypeFullName;
  const digest=await getDigest();
  const r=await fetch(`${SP_API}('${list}')/items`,{
    method:'POST',credentials:'include',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose','X-RequestDigest':digest},
    body:JSON.stringify({__metadata:{type},...data})
  });
  if(!r.ok){const t=await r.text();throw new Error('AddItem '+r.status+' '+t.slice(0,200));}
  return r.json();
}
async function spUpdateItem(list,id,data){
  const digest=await getDigest();
  await fetch(`${SP_API}('${list}')/items(${id})`,{
    method:'MERGE',credentials:'include',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose',
      'X-RequestDigest':digest,'IF-MATCH':'*','X-HTTP-Method':'MERGE'},
    body:JSON.stringify({__metadata:{type:`SP.Data.${list}ListItem`},...data})
  });
}

async function loadSpData(){
  spStatus='loading'; renderSpDot();
  try{
    const[solic,emp,cli,reg]=await Promise.all([
      spGet(`${SP_API}('Solicitantes')/items?$select=Title,Activo,Correo&$top=200`),
      spGet(`${SP_API}('Empresas')/items?$select=Title,Activo&$top=50`),
      spGet(`${SP_API}('ClientesPorSolicitante')/items?$select=Title,NombreCliente,IDCliente,Empresa&$top=500`),
      spGet(`${SP_API}('ReglasDocumentos')/items?$select=IDCliente,NombreCliente,Plantilla,OC,HES,ActaConformidad,ExcelLiquidacion,AceptacionServicio,CDR,Adicionales,Notas&$top=500`),
    ]);
    spData={
      solicitantes:solic.map(r=>[r.Title,r.Activo?'Si':'No',r.Correo]),
      empresas:emp.map(r=>[r.Title,r.Activo?'Si':'No']),
      clientes:cli.map(r=>[r.Title,r.NombreCliente,r.IDCliente,r.Empresa]),
      reglas:reg.map(r=>[r.IDCliente,r.NombreCliente,r.Plantilla?'Si':'No',r.OC?'Si':'No',r.HES?'Si':'No',r.ActaConformidad?'Si':'No',r.ExcelLiquidacion?'Si':'No',r.AceptacionServicio?'Si':'No',r.CDR?'Si':'No',r.Adicionales?'Si':'No',r.Notas])
    };
    spStatus='ok';
  }catch(e){
    console.warn('SP offline, usando datos locales:',e.message);
    spData={solicitantes:SPDATA.solicitantes,empresas:SPDATA.empresas,clientes:SPDATA.clientes,reglas:SPDATA.reglas};
    spStatus='local';
  }
  renderSpDot();
  if(user) renderCurrentTab();
}

function renderSpDot(){
  const d=document.getElementById('spDot'); if(!d) return;
  const map={ok:'● SharePoint',local:'● Datos locales',loading:'● conectando…',idle:'● —'};
  const cls={ok:'ok',local:'local',loading:'loading',idle:'loading'};
  d.className='sp-dot '+(cls[spStatus]||'');
  d.textContent=map[spStatus]||'';
}

function data(){return spData||SPDATA;}
function clientesFor(n){return data().clientes.filter(c=>c[0]===n);}
function reglaFor(id){return data().reglas.find(r=>r[0]===id);}
function reqDocs(id){
  const r=reglaFor(id); if(!r) return [];
  return DOC_TYPES.filter(dt=>{const i=REGLA_COLS.indexOf(dt.key); return r[i]==='Si'||r[i]===true;});
}
function clienteRow(){return data().clientes.find(c=>c[2]===st.idCliente);}
function isAdmin(){return user&&ADMINS.includes(user.nombre);}
function initials(n){return n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ─── STEPPER ─────────────────────────────────────────────────────────────────
function stepperHtml(){
  const labels=['Cliente','Documentos','Confirmar'];
  return '<div class="stepper">'+labels.map((l,i)=>{
    const n=i+1,c=n<st.step?'done':n===st.step?'active':'';
    return `<div class="snode ${c}"><div class="bar"></div><div class="lbl">${n}. ${l}</div></div>`;
  }).join('')+'</div>';
}

// ─── FILE VALIDATION ──────────────────────────────────────────────────────────
function handleFile(key,file){
  if(!file) return;
  if(file.size>MAX_FILE){st.docs[key]={fileName:file.name,sizeKB:Math.round(file.size/1024),base64:null,validation:{ok:false,msg:'Archivo demasiado grande (máx. 1.8 MB).'}};renderNew();return;}
  const reader=new FileReader();
  reader.onload=async e=>{
    const b64=e.target.result;
    const dt=DOC_TYPES.find(d=>d.key===key);
    const sKB=Math.round(file.size/1024);
    let v;
    if(dt.kind==='xlsx') v=await validateXlsx(b64);
    else if(dt.kind==='xlsx_gen') v=/\.(xlsx|xls)$/i.test(file.name)?{ok:true,msg:'Excel cargado'}:{ok:false,msg:'Debe ser .xlsx o .xls'};
    else if(dt.kind==='pdf_kw') v=await validatePdfKw(file,b64,key);
    else v={ok:true,msg:'Archivo cargado'};
    st.docs[key]={fileName:file.name,sizeKB:sKB,base64:b64,validation:v};
    renderNew();
  };
  reader.readAsDataURL(file);
}

async function validateXlsx(b64){
  try{
    const wb=XLSX.read(b64.split(',')[1],{type:'base64'});
    if(!wb.SheetNames?.length) return {ok:false,msg:'Excel vacío o ilegible.'};
    const ws=wb.Sheets[wb.SheetNames[0]];
    const allRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    const flat=allRows.flat().map(c=>String(c).toUpperCase());
    const isOF=flat.some(c=>c.includes('ORDEN DE FACTURACIÓN')||c.includes('ORDEN DE FACTURACION'));
    const hasRS=flat.some(c=>c.includes('RAZON SOCIAL')||c.includes('RAZÓN SOCIAL'));
    const hasRUC=flat.some(c=>c==='RUC'||c.includes('RUC:'));
    if(isOF&&hasRS&&hasRUC){
      if(!SKIP_VAL.includes(user?.nombre)&&st.idCliente){
        const cr=clienteRow();
        if(cr){
          const cn=cr[1].toUpperCase().split(' ').slice(0,2).join(' ');
          if(!flat.some(c=>c.includes(cn.substring(0,6)))){
            return {ok:false,msg:`La plantilla no corresponde al cliente seleccionado "${cr[1]}". Verifica que estás subiendo la plantilla correcta.`};
          }
        }
      }
      let rs='',ruc='',total='';
      allRows.forEach(r=>{
        const v=r.map(c=>String(c).trim());
        if(v.some(x=>x.toUpperCase().includes('RAZON SOCIAL')||x.toUpperCase().includes('RAZÓN SOCIAL')))
          rs=v.find(x=>x.length>4&&!x.toUpperCase().includes('RAZON')&&!x.toUpperCase().includes('SOCIAL'))||'';
        if(v.some(x=>x.toUpperCase()==='RUC'))
          ruc=v.find(x=>x.length>5&&/^[0-9]+$/.test(x))||'';
        if(v.some(x=>x.toUpperCase().includes('TOTAL :')))
          total=v.filter(x=>/^[0-9.,]+$/.test(x)).pop()||'';
      });
      return {ok:true,msg:`✓ Plantilla válida${rs?' · '+rs:''}${ruc?' · RUC: '+ruc:''}${total?' · Total: S/ '+total:''}`};
    }
    // Generic Excel — accept any readable Excel with data
    const nonEmpty=allRows.filter(r=>r.some(c=>String(c).trim()!==''));
    if(nonEmpty.length<1) return {ok:false,msg:'El Excel parece vacío. Verifica que tenga datos.'};
    return {ok:true,msg:`Excel cargado — ${nonEmpty.length} filas detectadas (hoja "${wb.SheetNames[0]}"). Verifica que sea el documento correcto.`};
  }catch(e){return {ok:false,msg:'No se pudo leer el Excel. Verifica que no esté dañado o en formato .xls antiguo — guárdalo como .xlsx e intenta de nuevo.'};}}

async function validatePdfKw(file,b64,key){
  const isPdf=/\.pdf$/i.test(file.name);
  const isXls=/\.(xlsx|xls)$/i.test(file.name);
  if(!isPdf&&!isXls) return {ok:false,msg:'Formato no válido. Se esperaba PDF.'};
  if(isPdf){
    try{
      const arr=Uint8Array.from(atob(b64.split(',')[1]),c=>c.charCodeAt(0));
      const hdr=new TextDecoder('utf-8',{fatal:false}).decode(arr.slice(0,5));
      if(!hdr.startsWith('%PDF')) return {ok:false,msg:'El archivo no es un PDF válido.'};
      const txt=new TextDecoder('utf-8',{fatal:false}).decode(arr);
      const kws=KW_MAP[key]||[];
      const found=kws.find(k=>txt.toLowerCase().includes(k));
      if(found) return {ok:true,msg:`✓ PDF válido — se detectó "${found}".`};
      const hasText=txt.match(/\([\x20-\x7E]{4,}\)/g)?.length>5;
      if(!hasText) return {ok:true,msg:'PDF cargado (escaneado — verifica visualmente que sea el documento correcto).'};
      return {ok:true,msg:'PDF cargado. Verifica que sea el documento correcto.'};
    }catch(e){return {ok:false,msg:'No se pudo leer el PDF.'};}
  }
  return {ok:true,msg:'Archivo Excel cargado.'};
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
async function submit(){
  const btn=document.getElementById('btnSend');
  btn.disabled=true;btn.textContent='Guardando…';
  const id='SOL-'+Date.now().toString(36).toUpperCase();
  const cr=clienteRow(),req=reqDocs(st.idCliente);
  const record={id,fecha:new Date().toISOString(),solicitante:user.nombre,correo:user.correo,tipoDoc:st.tipoDoc,sociedad:st.sociedad,
    idCliente:st.idCliente,nombreCliente:cr?cr[1]:'',empresa:cr?cr[3]:'',
    notas:st.notas,estado:'Pendiente',documentos:req.map(d=>d.key)};
  let warn='';
  try{
    if(spStatus==='ok'){
      await spAddItem('Solicitudes',{Title:id,Solicitante:user.nombre,IDCliente:st.idCliente,
        NombreCliente:cr?cr[1]:'',Empresa:cr?cr[3]:'',Estado:'Pendiente',Notas:st.notas,
        TipoDocumento:st.tipoDoc,Sociedad:st.sociedad,
        Documentos:req.map(d=>d.key).join(', '),FechaSolicitud:new Date().toISOString()});
    } else warn='SharePoint no disponible. Solicitud guardada localmente.';
  }catch(e){warn='No se pudo guardar en SharePoint. Registrado localmente.';console.error(e);}
  await saveLocal(id,record);
  try{
    await fetch('https://facturacion-servidor-lnbc.onrender.com/solicitud',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        sol_id:id,
        solicitante:user.nombre,
        correo_sol:user.correo,
        cliente:cr?cr[1]:'',
        id_cliente:st.idCliente,
        empresa:cr?cr[3]:'',
        tipo_doc:st.tipoDoc,
        sociedad:st.sociedad,
        documentos:req.map(d=>d.label).join(', '),
        notas:st.notas,
        fecha_hora:new Date().toLocaleString('es-PE'),
        archivos:req.map(dt=>({nombre:st.docs[dt.key]?.fileName||dt.key,base64:st.docs[dt.key]?.base64||''}))
          .filter(a=>a.base64)
      })
    });
  }catch(e){console.error('No se pudo enviar el correo de la solicitud',e);}
  showTicket(id,warn);
}

async function saveLocal(id,record){
  try{
    for(const dt of reqDocs(st.idCliente)){
      const d=st.docs[dt.key];
      if(d?.base64) await window.storage.set(`doc:${id}:${dt.key}`,JSON.stringify({fileName:d.fileName,base64:d.base64}),true);
    }
    await window.storage.set(`sol:${id}`,JSON.stringify(record),true);
    let idx=[];
    try{const r=await window.storage.get('sol:index',true);idx=r?JSON.parse(r.value):[];}catch(e){idx=[];}
    idx.unshift(id);
    await window.storage.set('sol:index',JSON.stringify(idx),true);
  }catch(e){console.warn('local save failed',e);}
}

function showTicket(id,warn=''){
  document.getElementById('viewNew').innerHTML=`<div class="ticket">
    <div class="tick-icon">✓</div>
    <p style="color:var(--muted);font-size:13px;">Solicitud registrada</p>
    <div class="tick-id">${esc(id)}</div>
    <p class="tick-sub">Guarda este código. Puedes ver el estado en "Mis solicitudes".</p>
    ${warn?`<div style="background:var(--amber-bg);border:1px solid var(--amber);border-radius:4px;padding:10px;font-size:12.5px;color:var(--amber);margin:14px 0;">${esc(warn)}</div>`:''}
    <div class="nav-row" style="justify-content:center;gap:12px;margin-top:24px;">
      <button class="btn" onclick="resetForm()">Nueva solicitud</button>
      <button class="btn verde" onclick="setTab('hist')">Ver mis solicitudes</button>
    </div>
  </div>`;
}
function resetForm(){st={step:1,idCliente:'',notas:'',docs:{},tipoDoc:'',sociedad:''};window.__plantillaData=null;currentTab='new';renderNavTabs();renderCurrentTab();}

// ─── HISTORIAL SOLICITANTE ────────────────────────────────────────────────────
async function renderHist(){
  const el=document.getElementById('viewHist');if(!el)return;
  el.innerHTML=`<div class="card"><p style="color:var(--muted);">Cargando…</p></div>`;
  let idx=[];
  try{const r=await window.storage.get('sol:index',true);idx=r?JSON.parse(r.value):[];}catch(e){idx=[];}
  const recs=[];
  for(const id of idx){
    try{const r=await window.storage.get(`sol:${id}`,true);if(r){const rec=JSON.parse(r.value);if(rec.solicitante===user.nombre)recs.push(rec);}}catch(e){}
  }
  if(!recs.length){el.innerHTML=`<div class="card" style="text-align:center;padding:50px;color:var(--muted);">No tienes solicitudes registradas aún.</div>`;return;}
  window.__histRecs=recs;
  el.innerHTML=`<div class="card">
    <div class="card-head"><h2>Mis solicitudes</h2><div class="sub">${recs.length} registros</div></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Código</th><th>Fecha</th><th>Tipo</th><th>Sociedad</th><th>Cliente</th><th>Empresa</th><th>Docs</th><th>Estado</th></tr></thead>
      <tbody>${recs.map(r=>`<tr>
        <td style="font-family:var(--mono);font-size:11px;">${esc(r.id)}</td>
        <td style="white-space:nowrap;">${new Date(r.fecha).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'})}</td>
        <td><span class="pill" style="background:var(--verde-cl);color:var(--negro);">${esc(r.tipoDoc||'—')}</span></td>
        <td style="font-size:12px;">${esc(r.sociedad||'—')}</td>
        <td>${esc(r.nombreCliente)}<br><span style="color:var(--muted);font-family:var(--mono);font-size:10px;">${esc(r.idCliente)}</span></td>
        <td>${esc(r.empresa)}</td>
        <td><details><summary>${(r.documentos||[]).length} docs</summary>${(r.documentos||[]).map(d=>`<span class="dl-link" onclick="dlDoc('${r.id}','${d}')">⬇ ${esc(d)}</span>`).join('')}</details></td>
        <td><span class="pill ${r.estado==='Pendiente'?'pill-pend':r.estado==='En proceso'?'pill-proc':'pill-fact'}">${esc(r.estado)}</span></td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

// ─── ADMIN PANEL ─────────────────────────────────────────────────────────────
async function renderAdmin(){
  const el=document.getElementById('viewAdmin');if(!el)return;
  el.innerHTML=`<div class="card"><p style="color:var(--muted);">Cargando todas las solicitudes…</p></div>`;
  let recs=[];
  if(spStatus==='ok'){
    try{
      const items=await spGet(`${SP_API}('Solicitudes')/items?$select=Id,Title,Solicitante,IDCliente,NombreCliente,Empresa,Estado,Notas,Documentos,FechaSolicitud&$orderby=FechaSolicitud desc&$top=500`);
      recs=items.map(r=>({id:r.Title,fecha:r.FechaSolicitud,solicitante:r.Solicitante,
        idCliente:r.IDCliente,nombreCliente:r.NombreCliente,empresa:r.Empresa,
        estado:r.Estado||'Pendiente',notas:r.Notas,
        documentos:(r.Documentos||'').split(',').map(d=>d.trim()).filter(Boolean),spId:r.Id}));
    }catch(e){console.warn('SP admin load failed',e);}
  }
  let idx=[];
  try{const r=await window.storage.get('sol:index',true);idx=r?JSON.parse(r.value):[];}catch(e){}
  for(const id of idx){
    try{const r=await window.storage.get(`sol:${id}`,true);if(r){const rec=JSON.parse(r.value);if(!recs.find(x=>x.id===rec.id))recs.push(rec);}}catch(e){}
  }
  window.__adminRecs=recs;
  renderAdminTable(recs,'','','');
}

function renderAdminTable(recs,fS,fE,fEmp){
  let f=recs;
  if(fS) f=f.filter(r=>r.solicitante===fS);
  if(fE) f=f.filter(r=>r.estado===fE);
  if(fEmp) f=f.filter(r=>r.empresa===fEmp);
  const solics=[...new Set(recs.map(r=>r.solicitante))].sort();
  const emps=[...new Set(recs.map(r=>r.empresa).filter(Boolean))].sort();
  const pend=recs.filter(r=>r.estado==='Pendiente').length;
  const proc=recs.filter(r=>r.estado==='En proceso').length;
  const fact=recs.filter(r=>r.estado==='Facturado').length;
  document.getElementById('viewAdmin').innerHTML=`
  <div class="kpi-grid">
    <div class="kpi pend"><div class="kpi-label">Pendientes</div><div class="kpi-val">${pend}</div></div>
    <div class="kpi proc"><div class="kpi-label">En proceso</div><div class="kpi-val">${proc}</div></div>
    <div class="kpi fact"><div class="kpi-label">Facturados</div><div class="kpi-val">${fact}</div></div>
  </div>
  <div class="card">
    <div class="card-head"><h2>Panel de Facturación</h2><div class="sub">Vista exclusiva — ${f.length} de ${recs.length} solicitudes</div></div>
    <div class="filters">
      <select id="aFS" onchange="applyAdmin()">
        <option value="">Todos los solicitantes</option>
        ${solics.map(s=>`<option value="${esc(s)}" ${s===fS?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <select id="aFE" onchange="applyAdmin()">
        <option value="">Todos los estados</option>
        <option value="Pendiente" ${fE==='Pendiente'?'selected':''}>Pendiente</option>
        <option value="En proceso" ${fE==='En proceso'?'selected':''}>En proceso</option>
        <option value="Facturado" ${fE==='Facturado'?'selected':''}>Facturado</option>
      </select>
      <select id="aFEmp" onchange="applyAdmin()">
        <option value="">Todas las empresas</option>
        ${emps.map(e=>`<option value="${esc(e)}" ${e===fEmp?'selected':''}>${esc(e)}</option>`).join('')}
      </select>
      <button class="btn sm" onclick="renderAdmin()">↻ Actualizar</button>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Código</th><th>Fecha</th><th>Solicitante</th><th>Tipo</th><th>Sociedad</th><th>Cliente</th><th>Empresa</th><th>Docs</th><th>Estado</th></tr></thead>
      <tbody>${f.length===0?`<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted);">Sin resultados.</td></tr>`:
      f.map(r=>`<tr>
        <td style="font-family:var(--mono);font-size:10.5px;">${esc(r.id)}</td>
        <td style="white-space:nowrap;font-size:11.5px;">${r.fecha?new Date(r.fecha).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}):''}</td>
        <td>${esc(r.solicitante)}</td>
        <td><span class="pill" style="background:var(--verde-cl);color:var(--negro);">${esc(r.tipoDoc||'—')}</span></td>
        <td style="font-size:12px;">${esc(r.sociedad||'—')}</td>
        <td>${esc(r.nombreCliente)}<br><span style="color:var(--muted);font-family:var(--mono);font-size:10px;">${esc(r.idCliente)}</span></td>
        <td>${esc(r.empresa)}</td>
        <td><details><summary>${(r.documentos||[]).length} docs</summary>${(r.documentos||[]).map(d=>`<span class="dl-link" onclick="dlDoc('${r.id}','${d}')">⬇ ${esc(d)}</span>`).join('')}</details></td>
        <td>
          <select class="ss" onchange="adminUpdateEstado('${r.id}',this.value,${r.spId||'null'})">
            <option value="Pendiente" ${r.estado==='Pendiente'?'selected':''}>Pendiente</option>
            <option value="En proceso" ${r.estado==='En proceso'?'selected':''}>En proceso</option>
            <option value="Facturado" ${r.estado==='Facturado'?'selected':''}>Facturado</option>
          </select>
        </td>
      </tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;
}

function applyAdmin(){
  renderAdminTable(window.__adminRecs||[],
    document.getElementById('aFS')?.value||'',
    document.getElementById('aFE')?.value||'',
    document.getElementById('aFEmp')?.value||'');
}

async function adminUpdateEstado(id,val,spId){
  if(spStatus==='ok'&&spId){
    try{await spUpdateItem('Solicitudes',spId,{Estado:val});}catch(e){console.warn(e);}
  }
  try{const r=await window.storage.get(`sol:${id}`,true);if(r){const rec=JSON.parse(r.value);rec.estado=val;await window.storage.set(`sol:${id}`,JSON.stringify(rec),true);}}catch(e){}
  const rec=window.__adminRecs?.find(x=>x.id===id);if(rec)rec.estado=val;
}

async function dlDoc(id,key){
  try{
    const r=await window.storage.get(`doc:${id}:${key}`,true);
    if(!r){alert('Archivo no encontrado en almacenamiento local.');return;}
    const d=JSON.parse(r.value);
    const a=document.createElement('a');a.href=d.base64;a.download=d.fileName;
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){alert('No se pudo descargar.');}
}
